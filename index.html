<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nabinagar STPP Stage-II — Projector WRM Portal</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <script>
    tailwind.config = {
      theme: { extend: { colors: { ntpc: { blue: '#0066b3', navy: '#06163a', orange: '#ea580c' } }, fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] } } }
    };
  </script>

  <style>
    body { background-color: #f8fafc; font-feature-settings: "cv02", "cv03", "cv04", "cv11"; }
    .fade-in { animation: fadeIn 0.15s ease-out forwards; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    .custom-scroll::-webkit-scrollbar { width: 8px; height: 8px; }
    .custom-scroll::-webkit-scrollbar-track { background: transparent; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    .sticky-th { position: sticky; top: 0; z-index: 20; }
    .sticky-th-sub { position: sticky; top: 38px; z-index: 19; }

    @media print {
      body { background: white !important; font-family: 'Arial', sans-serif; -webkit-print-color-adjust: exact; overflow: visible; }
      .no-print { display: none !important; }
      #printable-mom { display: block !important; width: 100% !important; color: black !important; }
      @page { size: A4 landscape; margin: 8mm; }
      table { border-collapse: collapse; width: 100%; page-break-inside: auto; margin-bottom: 12px; }
      tr { page-break-inside: avoid; page-break-after: auto; }
      th { background-color: #f1f5f9 !important; color: #000 !important; font-weight: bold; border: 1px solid #94a3b8; padding: 6px; font-size: 10px; }
      td { border: 1px solid #94a3b8; padding: 6px; font-size: 9.5px; }
      .print-header-box { text-align: center; border-bottom: 2px solid #0066b3; padding-bottom: 6px; margin-bottom: 10px; }
      .print-title { color: #0066b3; font-size: 24px; font-weight: 900; letter-spacing: -0.5px; margin: 0; text-transform: uppercase;}
      .print-subtitle { font-size: 11px; font-style: italic; font-weight: bold; margin-top: 2px; color: #334155; }
      .header-gradient-line { height: 2px; background: linear-gradient(to right, #0066b3 0%, #85b86b 50%, #ea580c 100%); margin: 4px auto; width: 80%; }
    }
  </style>
</head>
<body class="text-slate-800 antialiased overflow-hidden">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // =========================================================================
    // PASTE YOUR COPIED FIREBASE REALTIME DATABASE URL HERE (DO NOT FORGET /wrm_db.json AT THE END)
    // =========================================================================
    const FIREBASE_URL = "https://console.firebase.google.com/u/2/project/bopwrm/database/bopwrm-default-rtdb/data/~2F/wrm_db.json";

    const cleanDate = (val) => {
      if (!val) return "";
      val = val.trim();
      if (/^\d{4}-\d{2}-\d{2}$/.test(val)) return val;
      const parts = val.split(/[-/.]/);
      if (parts.length === 3) {
        if (parts[0].length === 4) return `${parts[0]}-${parts[1].padStart(2, '0')}-${parts[2].padStart(2, '0')}`;
        if (parts[2].length === 4) return `${parts[2]}-${parts[1].padStart(2, '0')}-${parts[0].padStart(2, '0')}`;
      }
      return val;
    };

    const DEFAULT_DB = {
      currentWeek: 35,
      weeks: [35],
      weekMeta: { "35": { manpower: 450, trained: 380, ntpcAttendees: [{name:"", desig:""}], tplAttendees: [{name:"", desig:""}], distributionList: "hop@ntpc.co.in, pm@tpl.com" } },
      teamMaster: [
        { id: "TM-1", empId: "HOP01", name: "Sanjay Kumar", desig: "HOP", dept: "", org: "NTPC", createdAt: Date.now() },
        { id: "TM-2", empId: "GM01", name: "Rajeev Singh", desig: "GM Projects", dept: "", org: "NTPC", createdAt: Date.now() },
        { id: "TM-3", empId: "CV01", name: "Sri Krishna", desig: "Executive Engineer", dept: "Civil", org: "NTPC", createdAt: Date.now() },
        { id: "TM-4", empId: "TPL01", name: "R. K. Sharma", desig: "Project Manager", dept: "Execution", org: "TPL", createdAt: Date.now() }
      ],
      l2Schedule: [], civilExecution: [], mechExecution: [], elecExecution: [], drawings: [], safetyLogs: [], qualityLogs: [], actions: []
    };

    function App() {
      const [db, setDbState] = useState(DEFAULT_DB);
      const [cloudStatus, setCloudStatus] = useState("Connecting to Cloud...");
      const [history, setHistory] = useState([]);
      const isInitialMount = useRef(true);

      // 1. Initial Cloud Sync on Startup
      useEffect(() => {
        if (FIREBASE_URL.includes("YOUR-PROJECT-ID")) {
          setCloudStatus("Offline (Paste Firebase URL)");
          const local = localStorage.getItem("ntpc_local_fallback");
          if (local) setDbState(JSON.parse(local));
          return;
        }

        setCloudStatus("Fetching Cloud Data...");
        fetch(FIREBASE_URL)
          .then(res => res.json())
          .then(data => {
            if (data && data.weeks) {
              setDbState(data);
              setCloudStatus("Cloud Synced (<80ms)");
            } else {
              // Push default schema if cloud database is empty
              saveToCloud(DEFAULT_DB);
            }
          })
          .catch(err => {
            console.error("Cloud fetch error:", err);
            setCloudStatus("Cloud Offline (Using Local)");
            const local = localStorage.getItem("ntpc_local_fallback");
            if (local) setDbState(JSON.parse(local));
          });
      }, []);

      // 2. Cloud Save Engine
      const saveToCloud = (dataToSave) => {
        localStorage.setItem("ntpc_local_fallback", JSON.stringify(dataToSave));
        if (FIREBASE_URL.includes("YOUR-PROJECT-ID")) return;

        setCloudStatus("Saving to Cloud...");
        fetch(FIREBASE_URL, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(dataToSave)
        })
        .then(() => setCloudStatus("Cloud Synced (<80ms)"))
        .catch(err => {
          console.error("Save failed:", err);
          setCloudStatus("Sync Failed (Saved Locally)");
        });
      };

      const setDb = (updater) => {
        setDbState(prev => {
          const nextState = typeof updater === 'function' ? updater(prev) : updater;
          setHistory(h => [...h.slice(-14), prev]);
          saveToCloud(nextState);
          return nextState;
        });
      };

      const handleUndo = () => {
        if (history.length > 0) {
          const previous = history[history.length - 1];
          setDbState(previous);
          setHistory(h => h.slice(0, -1));
          saveToCloud(previous);
        } else {
          alert("No more actions to undo.");
        }
      };

      const [tab, setTab] = useState("DASHBOARD");
      const [weekNo, setWeekNo] = useState(db.currentWeek || 35);
      const [activeDiscipline, setActiveDiscipline] = useState("Civil");
      
      const [selectedIds, setSelectedIds] = useState([]);
      const [showPasteModal, setShowPasteModal] = useState(false);
      const [pasteType, setPasteType] = useState("L2");
      const [pasteText, setPasteText] = useState("");

      const [showPrintModal, setShowPrintModal] = useState(false);
      const [printIncludeDashboard, setPrintIncludeDashboard] = useState(true);

      const currentMeta = db.weekMeta[weekNo] || { manpower: 0, trained: 0, ntpcAttendees: [], tplAttendees: [], distributionList: "" };
      const activeTasks = (activeDiscipline === "Civil" ? db.civilExecution : activeDiscipline === "Mechanical" ? db.mechExecution : db.elecExecution).filter(t => t.weekNo === weekNo);
      
      const toggleSelect = (id) => setSelectedIds(prev => prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id]);
      const toggleSelectAll = (ids) => setSelectedIds(prev => prev.length === ids.length ? [] : ids);

      const deleteSelected = (collectionName) => {
        if(!confirm(`Delete ${selectedIds.length} items?`)) return;
        setDb(prev => ({ ...prev, [collectionName]: prev[collectionName].filter(item => !selectedIds.includes(item.id)) }));
        setSelectedIds([]);
      };

      const deleteIndividual = (collectionName, id) => {
        if(!confirm("Delete this row?")) return;
        setDb(prev => ({ ...prev, [collectionName]: prev[collectionName].filter(item => item.id !== id) }));
      };

      const exportBackup = () => {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(db, null, 2));
        const a = document.createElement('a');
        a.setAttribute("href", dataStr);
        a.setAttribute("download", `NTPC_WRM_Data_Wk${weekNo}.json`);
        document.body.appendChild(a);
        a.click();
        a.remove();
      };

      const importBackup = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const parsed = JSON.parse(event.target.result);
            if (parsed.weekMeta) {
              setDb(parsed);
              setWeekNo(parsed.currentWeek || 35);
              alert("Data restored and uploaded to Cloud successfully.");
            } else { alert("Invalid backup file format"); }
          } catch(err) { alert("Error parsing file: " + err.message); }
        };
        reader.readAsText(file);
      };

      const exportToExcel = () => {
        const wb = XLSX.utils.book_new();
        const formatExec = (arr) => arr.filter(t => t.weekNo === weekNo).map(t => ({ "L2 Ref": t.l2Ref, "Task": t.taskName, "Unit": t.unit, "Plan": t.plan, "Actual": t.act, "Variance": t.act - t.plan, "Cum. Backlog": t.cumBacklog, "Next Plan": t.next, "Hindrance": t.hindrance, "TPL Remarks": t.tplRemarks, "NTPC Directives": t.ntpcDirectives }));
        XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(formatExec(db.civilExecution)), "Civil Works");
        XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(formatExec(db.mechExecution)), "Mechanical Works");
        XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(formatExec(db.elecExecution)), "Electrical Works");
        
        const dwgs = db.drawings.filter(d => d.weekNo === weekNo).map(d => ({ "L2 Ref": d.l2Ref, "Discipline": d.discipline, "Drawing No": d.drawingNo, "Desc": d.desc, "Priority": d.priority, "Target": d.targetDate, "Status": d.status, "Impact": d.frontImpact }));
        XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(dwgs), "Drawings DCI");
        
        const acts = db.actions.filter(a => a.weekNo === weekNo).map(a => ({ "Category": a.category, "Description": a.desc, "Responsibility": a.responsibility, "Target": a.targetDate, "Status": a.status, "NTPC Remarks": a.ntpcRemarks }));
        XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(acts), "Action Tracker");
        XLSX.writeFile(wb, `NTPC_WRM_Week_${weekNo}_Export.xlsx`);
      };

      const executeExcelImport = () => {
        if (!pasteText.trim()) return;
        const rows = pasteText.trim().split("\n").map(r => r.split("\t"));
        const ts = Date.now();

        if (pasteType === "L2") {
          const newFronts = rows.map((r, i) => ({ id: "L2-" + ts + i, discipline: (r[0] || "Civil").trim(), desc: (r[1] || "").trim(), l2Start: cleanDate(r[2]), actStart: cleanDate(r[3]), l2End: cleanDate(r[4]), actEnd: cleanDate(r[5]), createdAt: ts })).filter(item => item.desc);
          setDb(prev => ({ ...prev, l2Schedule: [...newFronts, ...prev.l2Schedule] }));
        } else if (pasteType === "Drawings") {
          const newDwgs = rows.map((r, i) => ({ id: "DW-" + ts + i, weekNo, l2Ref: (r[0] || "").trim(), discipline: (r[1] || "Civil").trim(), drawingNo: (r[2] || "").trim(), desc: (r[3] || "").trim(), priority: (r[4] || "Moderate").trim(), targetDate: cleanDate(r[5]), expectedDate: cleanDate(r[6]), status: (r[7] || "Pending").trim(), frontImpact: (r[8] || "").trim(), remarks: (r[9] || "").trim(), createdAt: ts })).filter(item => item.drawingNo);
          setDb(prev => ({ ...prev, drawings: [...newDwgs, ...prev.drawings] }));
        } else if (pasteType === "Actions") {
          const newActs = rows.map((r, i) => ({ id: "ACT-" + ts + i, weekNo, category: (r[0] || "Execution").trim(), desc: (r[1] || "").trim(), responsibility: (r[2] || "TPL").trim(), targetDate: cleanDate(r[3]), revisedDate: cleanDate(r[4]), status: (r[5] || "Pending").trim(), ntpcRemarks: (r[6] || "").trim(), createdAt: ts })).filter(item => item.desc);
          setDb(prev => ({ ...prev, actions: [...newActs, ...prev.actions] }));
        } else {
          const collection = activeDiscipline === "Civil" ? "civilExecution" : activeDiscipline === "Mechanical" ? "mechExecution" : "elecExecution";
          const prefix = activeDiscipline === "Civil" ? "CV-" : activeDiscipline === "Mechanical" ? "MC-" : "EL-";
          const newTasks = rows.map((r, i) => ({ id: prefix + ts + i, weekNo, l2Ref: (r[0] || "").trim(), taskName: (r[1] || "").trim(), unit: (r[2] || (activeDiscipline === "Civil" ? "m³" : "MT")).trim(), plan: parseFloat(r[3]) || 0, act: parseFloat(r[4]) || 0, next: parseFloat(r[5]) || 0, cumBacklog: parseFloat(r[6]) || 0, hindrance: (r[7] || "").trim(), tplRemarks: (r[8] || "").trim(), ntpcDirectives: (r[9] || "").trim(), milestone: "In Progress", createdAt: ts })).filter(item => item.taskName);
          setDb(prev => ({ ...prev, [collection]: [...newTasks, ...prev[collection]] }));
        }

        setPasteText("");
        setShowPasteModal(false);
      };

      const handleTaskChange = (taskId, field, val, collection) => {
        setDb(prev => ({
          ...prev, [collection]: prev[collection].map(item => {
            if (item.id !== taskId) return item;
            const nextItem = { ...item, [field]: val };
            if (field === 'plan' || field === 'act') {
              const p = parseFloat(field === 'plan' ? val : nextItem.plan) || 0;
              const a = parseFloat(field === 'act' ? val : nextItem.act) || 0;
              nextItem.cumBacklog = Math.max(0, (parseFloat(item.prevBacklog||0)) + (p - a));
            }
            return nextItem;
          })
        }));
      };

      const handleAddRow = (type) => {
        const ts = Date.now();
        if (type === "L2") { setDb(prev => ({ ...prev, l2Schedule: [{ id: "L2-"+ts, discipline: "Civil", desc: "", l2Start: "", actStart: "", l2End: "", actEnd: "", createdAt: ts }, ...prev.l2Schedule] })); } 
        else if (type === "Team") { setDb(prev => ({ ...prev, teamMaster: [{ id: "TM-"+ts, empId: "", name: "", desig: "", dept: "", org: "NTPC", createdAt: ts }, ...prev.teamMaster] })); } 
        else if (type === "Drawings") { setDb(prev => ({ ...prev, drawings: [{ id: "DW-"+ts, weekNo, l2Ref: "", discipline: "Civil", drawingNo: "", desc: "", priority: "Moderate", targetDate: "", expectedDate: "", status: "Pending", frontImpact: "", remarks: "", createdAt: ts }, ...prev.drawings] })); } 
        else if (type === "Actions") { setDb(prev => ({ ...prev, actions: [{ id: "ACT-"+ts, weekNo, category: "Execution", desc: "", responsibility: "TPL", targetDate: "", revisedDate: "", status: "Pending", ntpcRemarks: "", createdAt: ts }, ...prev.actions] })); } 
        else {
          const col = type === "Civil" ? "civilExecution" : type === "Mechanical" ? "mechExecution" : "elecExecution";
          const prefix = type === "Civil" ? "CV-" : type === "Mechanical" ? "MC-" : "EL-";
          setDb(prev => ({ ...prev, [col]: [{ id: prefix+ts, weekNo, l2Ref: "", taskName: "", unit: type==="Civil"?"m³":type==="Mechanical"?"MT":"m", plan: 0, act: 0, next: 0, cumBacklog: 0, prevBacklog: 0, hindrance: "", tplRemarks: "", ntpcDirectives: "", milestone: "In Progress", createdAt: ts }, ...prev[col]] }));
        }
      };

      const renderTeamDropdown = (orgFilter) => {
        const orgTeam = db.teamMaster.filter(t => t.org === orgFilter && t.name);
        const topLevel = orgTeam.filter(t => { const d = (t.desig||"").toUpperCase(); return d.includes('HOP') || d.includes('GM PROJECT'); });
        const others = orgTeam.filter(t => { const d = (t.desig||"").toUpperCase(); return !(d.includes('HOP') || d.includes('GM PROJECT')); });
        const depts = [...new Set(others.map(t => t.dept || "Other"))].sort();

        return (
          <React.Fragment>
            <option value="">Select Attendee...</option>
            {topLevel.map(t => <option key={t.id} value={t.id}>🌟 {t.desig} - {t.name}</option>)}
            {depts.map(d => (
              <optgroup key={d} label={`Dept: ${d}`}>
                {others.filter(t => (t.dept||"Other") === d).map(t => <option key={t.id} value={t.id}>{t.name} ({t.desig})</option>)}
              </optgroup>
            ))}
          </React.Fragment>
        );
      };

      const getHitCount = (arr) => arr.filter(t => parseFloat(t.act) >= parseFloat(t.plan) && parseFloat(t.plan) > 0).length;
      const civilWk = db.civilExecution.filter(t => t.weekNo === weekNo);
      const mechWk = db.mechExecution.filter(t => t.weekNo === weekNo);
      const elecWk = db.elecExecution.filter(t => t.weekNo === weekNo);
      const pendingDwgs = db.drawings.filter(d => d.weekNo === weekNo && d.status !== "Cat-1 Approved").length;
      const openActs = db.actions.filter(a => a.weekNo === weekNo && a.status !== "Completed").length;
      const openHse = db.safetyLogs.filter(s => s.weekNo === weekNo && s.status === "Open" && s.category === "Unsafe Condition").length;

      const handleEmailTeam = () => {
        const emailList = currentMeta.distributionList || "";
        const subject = encodeURIComponent(`Minutes of Meeting: Nabinagar STPP WRM - Week #${weekNo}`);
        const body = encodeURIComponent(`Dear Team,\n\nPlease find the summary for the Weekly Review Meeting (WRM) - Week #${weekNo}.\n\nSITE STATISTICS:\n- Deployed Manpower: ${currentMeta.manpower}\n- Trained Personnel: ${currentMeta.trained}\n\nEXECUTION HIGHLIGHTS:\n- Civil Targets Hit: ${getHitCount(civilWk)} / ${civilWk.length}\n- Pending Drawings: ${pendingDwgs}\n- Open Bottlenecks: ${openActs}\n- Open HSE Issues: ${openHse}\n\nPlease find the detailed MoM and database backup attached.\n\nRegards,\nWRM Administrator`);
        window.location.href = `mailto:${emailList}?subject=${subject}&body=${body}`;
      };

      return (
        <div className="flex h-screen w-screen bg-slate-50 overflow-hidden font-sans text-sm">
          
          <aside className="w-64 bg-ntpc-navy text-white flex flex-col h-screen shadow-2xl flex-shrink-0 z-50 no-print">
            <div className="p-4 flex items-center gap-3 border-b border-white/10">
              <div className="w-10 h-10 bg-ntpc-orange text-white rounded-xl flex items-center justify-center font-black text-2xl shadow-md border border-white/20">N</div>
              <div><h1 className="text-sm font-black uppercase tracking-wider leading-none">Nabinagar STPP</h1><p className="text-[10px] text-orange-400 font-bold uppercase tracking-widest mt-1">Stage-II Portal</p></div>
            </div>

            <nav className="flex-1 px-3 py-4 space-y-2 overflow-y-auto custom-scroll">
              {[
                { id: "DASHBOARD", icon: "📊", label: "Executive Summary" },
                { id: "TEAM ROSTER", icon: "👥", label: "Master Team List" },
                { id: "L2 SCHEDULE", icon: "📅", label: "L2 Master Fronts" },
                { id: "EXECUTION", icon: "🏗️", label: "Discipline Execution" },
                { id: "DRAWINGS", icon: "📐", label: "Engineering & DCI" },
                { id: "HSE & QA", icon: "🛡️", label: "HSE & Quality NCR" },
                { id: "ACTIONS", icon: "⚡", label: "Bottlenecks Tracker" }
              ].map(m => (
                <button key={m.id} onClick={() => setTab(m.id)}
                  className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl text-xs font-black uppercase tracking-wider transition-all ${tab === m.id ? "bg-ntpc-orange text-white shadow-md" : "text-slate-400 hover:bg-white/5 hover:text-white"}`}>
                  <span className="text-lg">{m.icon}</span>{m.label}
                </button>
              ))}
            </nav>

            <div className="p-4 border-t border-white/10 space-y-3 bg-slate-900/50">
              <div className="text-[10px] font-black uppercase text-slate-400 text-center tracking-widest mb-1">Data & Safety Tools</div>
              <button onClick={handleUndo} className="w-full bg-slate-700 hover:bg-slate-600 text-white py-2 rounded text-xs font-black uppercase flex items-center justify-center gap-2">↩ Undo Last Action</button>
              <div className="flex gap-2 mt-2 pt-2 border-t border-white/10">
                <button onClick={exportBackup} title="Export database to JSON file" className="flex-1 bg-white/10 hover:bg-white/20 text-white py-1.5 rounded text-[9px] font-black uppercase">Export JSON</button>
                <label className="flex-1 bg-white/10 hover:bg-white/20 text-white py-1.5 rounded text-[9px] font-black uppercase text-center cursor-pointer">
                  Import<input type="file" accept=".json" onChange={importBackup} className="hidden" />
                </label>
              </div>
            </div>
          </aside>

          <div className="flex-1 flex flex-col h-full overflow-hidden">
            
            <header className="bg-white border-b border-slate-200 px-6 py-3.5 flex items-center justify-between z-30 shadow-sm no-print">
              <div className="flex items-center gap-4">
                <span className="text-sm font-black text-ntpc-blue uppercase tracking-wider">Review Week:</span>
                <select value={weekNo} onChange={e => setWeekNo(parseInt(e.target.value))} className="bg-slate-100 font-black text-sm px-3 py-2 rounded-lg border border-slate-300 outline-none">
                  {db.weeks.map(w => <option key={w} value={w}>Week {w}</option>)}
                </select>
                <button onClick={() => {
                  const nx = parseInt(prompt("Enter New Week Number:", weekNo + 1));
                  if(nx && !db.weeks.includes(nx)) {
                    setDb(prev => {
                      const roll = (arr) => arr.filter(t => t.weekNo === weekNo && t.milestone !== "Completed").map(t => ({ ...t, id: t.id.split('-')[0]+"-"+Date.now()+Math.floor(Math.random()*100), weekNo: nx, plan: parseFloat(t.next)||0, act: 0, next: 0, cumBacklog: Math.max(0, (parseFloat(t.cumBacklog)||0) + ((parseFloat(t.plan)||0)-(parseFloat(t.act)||0))), prevBacklog: Math.max(0, (parseFloat(t.cumBacklog)||0) + ((parseFloat(t.plan)||0)-(parseFloat(t.act)||0))), hindrance: "", tplRemarks: "", ntpcDirectives: "", createdAt: Date.now() }));
                      const rollD = prev.drawings.filter(d => d.weekNo === weekNo && d.status !== "Cat-1 Approved").map(d => ({...d, id: "DW-"+Date.now()+Math.floor(Math.random()*100), weekNo: nx, createdAt: Date.now()}));
                      const rollA = prev.actions.filter(a => a.weekNo === weekNo && a.status !== "Completed").map(a => ({...a, id: "ACT-"+Date.now()+Math.floor(Math.random()*100), weekNo: nx, createdAt: Date.now()}));
                      return {
                        ...prev, currentWeek: nx, weeks: [nx, ...prev.weeks],
                        weekMeta: { ...prev.weekMeta, [nx]: prev.weekMeta[weekNo] },

                        <tr key={d.id} className={`hover:bg-slate-50 ${selectedIds.includes(d.id)?'bg-rose-50':''}`}>
                          <td className="p-3 text-center"><input type="checkbox" checked={selectedIds.includes(d.id)} onChange={() => toggleSelect(d.id)} className="w-4 h-4 cursor-pointer"/></td>
                          <td className="p-2"><select value={d.l2Ref} onChange={e => handleTaskChange(d.id, "l2Ref", e.target.value, "drawings")} className="w-full bg-slate-100 rounded p-2 font-bold text-xs text-ntpc-blue outline-none cursor-pointer"><option value="">-- L2 Link --</option>{db.l2Schedule.map(l => <option key={l.id} value={l.desc}>{l.desc}</option>)}</select></td>
                          <td className="p-2"><input type="text" value={d.drawingNo} onChange={e => handleTaskChange(d.id, "drawingNo", e.target.value, "drawings")} className="w-full bg-slate-100 p-2 rounded font-bold text-xs outline-none" /></td>
                          <td className="p-2"><input type="text" value={d.desc} onChange={e => handleTaskChange(d.id, "desc", e.target.value, "drawings")} className="w-full bg-transparent border-b p-2 font-bold text-sm outline-none" /></td>
                          <td className="p-2"><select value={d.priority} onChange={e => handleTaskChange(d.id, "priority", e.target.value, "drawings")} className={`w-full p-2 rounded text-xs font-black text-center outline-none cursor-pointer ${d.priority === 'High' ? 'bg-rose-100 text-rose-700' : 'bg-amber-100 text-amber-700'}`}><option>High</option><option>Moderate</option><option>Low</option></select></td>
                          <td className="p-2 text-center"><input type="date" value={d.targetDate} onChange={e => handleTaskChange(d.id, "targetDate", e.target.value, "drawings")} className="bg-slate-100 p-2 rounded text-xs font-bold outline-none" /></td>
                          <td className="p-2 text-center"><button onClick={() => { const next = d.status === "Pending" ? "Under Review" : d.status === "Under Review" ? "Cat-1 Approved" : "Pending"; handleTaskChange(d.id, "status", next, "drawings"); }} className={`px-3 py-1.5 rounded text-xs font-black uppercase w-full shadow-sm ${d.status === 'Cat-1 Approved' ? 'bg-emerald-100 text-emerald-800 border border-emerald-300' : d.status === 'Under Review' ? 'bg-amber-100 text-amber-800 border border-amber-300' : 'bg-rose-100 text-rose-800 border border-rose-300'}`}>{d.status}</button></td>
                          <td className="p-2"><textarea rows="1" value={d.frontImpact} onChange={e => handleTaskChange(d.id, "frontImpact", e.target.value, "drawings")} className="w-full bg-rose-50/50 border border-slate-200 rounded p-2 text-xs font-bold text-rose-950 outline-none" /></td>
                          <td className="p-2"><textarea rows="1" value={d.remarks} onChange={e => handleTaskChange(d.id, "remarks", e.target.value, "drawings")} className="w-full bg-slate-50 border border-slate-200 rounded p-2 text-xs outline-none" /></td>
                          <td className="p-2 text-center"><button onClick={()=>deleteIndividual("drawings", d.id)} className="text-rose-500 hover:text-rose-700 text-lg">🗑️</button></td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              )}

              {tab === "HSE & QA" && (
                <div className="space-y-6 fade-in">
                  <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex flex-wrap items-center justify-between gap-4">
                    <div className="flex items-center gap-8">
                      <div><label className="text-xs font-bold uppercase text-slate-400 block mb-1">Total Site Manpower</label><input type="number" value={currentMeta.manpower} onChange={e => setDb(p=>({...p, weekMeta:{...p.weekMeta, [weekNo]:{...currentMeta, manpower: parseInt(e.target.value)||0}}}))} className="font-black text-2xl text-ntpc-blue bg-slate-50 border border-slate-300 rounded-lg p-2 w-32 outline-none text-center" /></div>
                      <div><label className="text-xs font-bold uppercase text-slate-400 block mb-1">Total Persons Trained</label><input type="number" value={currentMeta.trained} onChange={e => setDb(p=>({...p, weekMeta:{...p.weekMeta, [weekNo]:{...currentMeta, trained: parseInt(e.target.value)||0}}}))} className="font-black text-2xl text-emerald-600 bg-slate-50 border border-slate-300 rounded-lg p-2 w-32 outline-none text-center" /></div>
                    </div>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div className="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
                      <div className="bg-slate-50 p-4 border-b flex justify-between items-center"><h3 className="text-sm font-black text-orange-600 uppercase tracking-wider">Safety Violations Log</h3></div>
                      <table className="w-full text-left text-sm">
                        <thead><tr className="bg-ntpc-navy text-white text-[10px] uppercase sticky-th"><th className="p-2 w-8 text-center"><input type="checkbox" onChange={e => toggleSelectAll(db.safetyLogs.filter(x=>x.weekNo===weekNo).map(x=>x.id))} checked={selectedIds.length===db.safetyLogs.filter(x=>x.weekNo===weekNo).length && db.safetyLogs.filter(x=>x.weekNo===weekNo).length>0}/></th><th className="p-2 w-[25%]">Category</th><th className="p-2 w-[50%]">Observation</th><th className="p-2 text-center">Status</th><th className="p-2 w-8"></th></tr></thead>
                        <tbody className="divide-y divide-slate-100">
                          {db.safetyLogs.filter(s => s.weekNo === weekNo).map(s => (
                            <tr key={s.id} className={`hover:bg-slate-50 ${selectedIds.includes(s.id)?'bg-rose-50':''}`}>
                              <td className="p-2 text-center"><input type="checkbox" checked={selectedIds.includes(s.id)} onChange={() => toggleSelect(s.id)} className="w-4 h-4 cursor-pointer"/></td>
                              <td className="p-2"><input type="text" value={s.category} onChange={e => handleTaskChange(s.id, "category", e.target.value, "safetyLogs")} className="w-full bg-slate-100 p-2 rounded font-bold text-xs outline-none" /></td>
                              <td className="p-2"><textarea rows="2" value={s.desc} onChange={e => handleTaskChange(s.id, "desc", e.target.value, "safetyLogs")} className="w-full bg-transparent border-b p-2 text-xs font-medium outline-none"></textarea></td>
                              <td className="p-2 text-center"><button onClick={() => handleTaskChange(s.id, "status", s.status==='Open'?'Complied':'Open', "safetyLogs")} className={`px-2 py-1 rounded text-[10px] font-black uppercase w-full ${s.status === 'Complied' ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800'}`}>{s.status}</button></td>
                              <td className="p-2 text-center"><button onClick={()=>deleteIndividual("safetyLogs", s.id)} className="text-rose-500 hover:text-rose-700 text-lg">🗑️</button></td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                      <div className="p-3 bg-slate-50 border-t"><button onClick={() => handleAddRow("Safety")} className="text-xs font-black text-ntpc-orange hover:underline uppercase">+ Add Safety Log</button></div>
                    </div>

                    <div className="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
                      <div className="bg-slate-50 p-4 border-b flex justify-between items-center"><h3 className="text-sm font-black text-blue-600 uppercase tracking-wider">Quality (FQA) NCRs</h3></div>
                      <table className="w-full text-left text-sm">
                        <thead><tr className="bg-ntpc-navy text-white text-[10px] uppercase sticky-th"><th className="p-2 w-8 text-center"><input type="checkbox" onChange={e => toggleSelectAll(db.qualityLogs.filter(x=>x.weekNo===weekNo).map(x=>x.id))} checked={selectedIds.length===db.qualityLogs.filter(x=>x.weekNo===weekNo).length && db.qualityLogs.filter(x=>x.weekNo===weekNo).length>0}/></th><th className="p-2 w-[25%]">Category</th><th className="p-2 w-[50%]">Observation</th><th className="p-2 text-center">Status</th><th className="p-2 w-8"></th></tr></thead>
                        <tbody className="divide-y divide-slate-100">
                          {db.qualityLogs.filter(q => q.weekNo === weekNo).map(q => (
                            <tr key={q.id} className={`hover:bg-slate-50 ${selectedIds.includes(q.id)?'bg-rose-50':''}`}>
                              <td className="p-2 text-center"><input type="checkbox" checked={selectedIds.includes(q.id)} onChange={() => toggleSelect(q.id)} className="w-4 h-4 cursor-pointer"/></td>
                              <td className="p-2"><input type="text" value={q.category} onChange={e => handleTaskChange(q.id, "category", e.target.value, "qualityLogs")} className="w-full bg-slate-100 p-2 rounded font-bold text-xs outline-none" /></td>
                              <td className="p-2"><textarea rows="2" value={q.desc} onChange={e => handleTaskChange(q.id, "desc", e.target.value, "qualityLogs")} className="w-full bg-transparent border-b p-2 text-xs font-medium outline-none"></textarea></td>
                              <td className="p-2 text-center"><button onClick={() => handleTaskChange(q.id, "status", q.status==='Open'?'Complied':'Open', "qualityLogs")} className={`px-2 py-1 rounded text-[10px] font-black uppercase w-full ${q.status === 'Complied' ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800'}`}>{q.status}</button></td>
                              <td className="p-2 text-center"><button onClick={()=>deleteIndividual("qualityLogs", q.id)} className="text-rose-500 hover:text-rose-700 text-lg">🗑️</button></td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                      <div className="p-3 bg-slate-50 border-t"><button onClick={() => handleAddRow("Quality")} className="text-xs font-black text-blue-600 hover:underline uppercase">+ Add Quality NCR</button></div>
                    </div>
                  </div>
                </div>
              )}

              {tab === "ACTIONS" && (
                <div className="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden fade-in">
                  <div className="p-4 bg-slate-50 border-b flex justify-between items-center">
                    <h2 className="text-sm font-black text-ntpc-blue uppercase tracking-wider">Critical Bottlenecks & Action Tracker</h2>
                    <div className="flex gap-2">
                      <button onClick={() => { setPasteType("Actions"); setShowPasteModal(true); }} className="bg-blue-600 text-white px-4 py-2 rounded-lg text-xs font-black uppercase shadow">📋 Paste from Excel</button>
                      <button onClick={() => handleAddRow("Actions")} className="bg-ntpc-orange text-white px-4 py-2 rounded-lg text-xs font-black uppercase">+ Add Action Item</button>
                    </div>
                  </div>
                  <table className="w-full text-left text-sm">
                    <thead><tr className="bg-ntpc-navy text-white text-xs uppercase sticky-th"><th className="p-3 w-10 text-center"><input type="checkbox" onChange={e => toggleSelectAll(db.actions.filter(x=>x.weekNo===weekNo).map(x=>x.id))} checked={selectedIds.length===db.actions.filter(x=>x.weekNo===weekNo).length && db.actions.filter(x=>x.weekNo===weekNo).length>0}/></th><th className="p-3 w-[10%]">Category</th><th className="p-3 w-[26%]">Action Item Description</th><th className="p-3 w-[10%]">Resp</th><th className="p-3 text-center w-[10%]">Target Date</th><th className="p-3 text-center w-[10%]">Status</th><th className="p-3 w-[24%]">NTPC Remarks</th><th className="p-3 w-10"></th></tr></thead>
                    <tbody className="divide-y divide-slate-100">
                      {db.actions.filter(a => a.weekNo === weekNo).map(a => (
                        <tr key={a.id} className={`hover:bg-slate-50 ${selectedIds.includes(a.id)?'bg-rose-50':''}`}>
                          <td className="p-3 text-center"><input type="checkbox" checked={selectedIds.includes(a.id)} onChange={() => toggleSelect(a.id)} className="w-4 h-4 cursor-pointer"/></td>
                          <td className="p-2"><select value={a.category} onChange={e => handleTaskChange(a.id, "category", e.target.value, "actions")} className="w-full bg-slate-100 rounded p-2 font-bold text-xs outline-none"><option>Execution</option><option>Engineering</option><option>Procurement</option><option>Clearance</option></select></td>
                          <td className="p-2"><input type="text" value={a.desc} onChange={e => handleTaskChange(a.id, "desc", e.target.value, "actions")} className="w-full bg-transparent border-b p-2 font-bold text-sm outline-none" /></td>
                          <td className="p-2"><input type="text" value={a.responsibility} onChange={e => handleTaskChange(a.id, "responsibility", e.target.value, "actions")} className="w-full bg-slate-100 font-bold p-2 rounded text-xs outline-none" /></td>
                          <td className="p-2 text-center"><input type="date" value={a.targetDate} onChange={e => handleTaskChange(a.id, "targetDate", e.target.value, "actions")} className="bg-slate-100 p-2 rounded text-xs font-bold outline-none" /></td>
                          <td className="p-2 text-center"><button onClick={() => handleTaskChange(a.id, "status", a.status === 'Pending' ? 'In Progress' : a.status === 'In Progress' ? 'Completed' : 'Pending', "actions")} className={`px-3 py-1.5 rounded text-xs font-black uppercase w-full shadow-sm ${a.status === 'Completed' ? 'bg-emerald-100 text-emerald-800 border border-emerald-300' : a.status === 'In Progress' ? 'bg-amber-100 text-amber-800 border border-amber-300' : 'bg-rose-100 text-rose-800 border border-rose-300'}`}>{a.status}</button></td>
                          <td className="p-2"><textarea rows="1" value={a.ntpcRemarks} onChange={e => handleTaskChange(a.id, "ntpcRemarks", e.target.value, "actions")} className="w-full bg-rose-50/30 border border-slate-200 rounded p-2 text-xs font-bold text-rose-950 outline-none" /></td>
                          <td className="p-2 text-center"><button onClick={()=>deleteIndividual("actions", a.id)} className="text-rose-500 hover:text-rose-700 text-lg">🗑️</button></td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              )}
            </main>
          </div>

          {/* MODAL: EXCEL PASTE IMPORT */}
          {showPasteModal && (
            <div className="fixed inset-0 bg-slate-950/70 backdrop-blur-sm z-50 flex items-center justify-center p-4 fade-in">
              <div className="bg-white rounded-2xl p-6 max-w-lg w-full shadow-2xl space-y-4">
                <h3 className="text-sm font-black uppercase text-ntpc-blue">Paste {pasteType} Rows from Excel</h3>
                <p className="text-[11px] text-slate-500 font-bold">
                  {pasteType === "L2" ? "Columns: [Discipline | Description | L2 Start | Act Start | L2 End | Act End]" 
                   : pasteType === "Drawings" ? "Columns: [L2 Link | Discipline | Dwg No | Desc | Priority | Target | Expected | Status | Impact | Remarks]"
                   : pasteType === "Actions" ? "Columns: [Category | Description | Resp | Target | Revised | Status | NTPC Remarks]"
                   : "Columns: [L2 Ref | Task Name | Unit | Plan | Actual | Next Plan | Cum Backlog | Hindrance | TPL Remarks | NTPC Directives]"}
                </p>
                <textarea rows="8" value={pasteText} onChange={e => setPasteText(e.target.value)} placeholder="Click here and press Ctrl+V to paste tabular rows from Excel..." className="w-full border p-3 rounded text-xs font-mono bg-slate-50 outline-none focus:border-ntpc-blue"></textarea>
                <div className="flex gap-2">
                  <button onClick={() => setShowPasteModal(false)} className="flex-1 bg-slate-100 py-2 rounded text-xs font-black uppercase hover:bg-slate-200">Cancel</button>
                  <button onClick={executeExcelImport} className="flex-1 bg-blue-600 text-white py-2 rounded text-xs font-black uppercase shadow hover:bg-blue-700">Import Rows</button>
                </div>
              </div>
            </div>
          )}

          {/* MODAL: PRINT CONFIGURATION */}
          {showPrintModal && (
            <div className="fixed inset-0 bg-slate-950/70 backdrop-blur-sm z-50 flex items-center justify-center p-4 fade-in">
              <div className="bg-white rounded-2xl p-6 max-w-sm w-full shadow-2xl space-y-5">
                <h3 className="text-lg font-black uppercase text-ntpc-blue">Configure Print MoM</h3>
                
                <label className="flex items-center gap-3 text-sm font-bold cursor-pointer bg-slate-50 p-3 rounded-lg border border-slate-200">
                  <input type="checkbox" checked={printIncludeDashboard} onChange={e => setPrintIncludeDashboard(e.target.checked)} className="w-5 h-5 accent-ntpc-blue" />
                  Include Executive Dashboard Summary
                </label>

                <div className="flex gap-2">
                  <button onClick={() => setShowPrintModal(false)} className="flex-1 bg-slate-100 py-2.5 rounded-lg text-xs font-black uppercase hover:bg-slate-200">Cancel</button>
                  <button onClick={() => { setShowPrintModal(false); setTimeout(() => window.print(), 300); }} className="flex-1 bg-ntpc-blue text-white py-2.5 rounded-lg text-xs font-black uppercase shadow hover:bg-blue-800">Confirm & Print</button>
                </div>
              </div>
            </div>
          )}

          {/* PRINTABLE A4 LANDSCAPE MOM (NO LOGOS) */}
          <div id="printable-mom" className="hidden print:block font-sans bg-white text-black">
            
            <div className="print-header-box">
              <h1 className="print-title">Nabinagar Super Thermal Power Project</h1>
              <div className="header-gradient-line"></div>
              <div className="print-subtitle">1980 MW (Stage-I: 3X660) & 2400 MW (Stage-II: 3X800) under construction</div>
            </div>

            <div className="flex justify-between items-end mb-3 pb-1 border-b border-black">
              <h2 className="text-[12px] font-black uppercase tracking-wider">Minutes of Weekly Review Meeting (WRM) — Review Week #{weekNo}</h2>
              <div className="text-[9px] font-bold text-right uppercase">REF: NTPC/NSTPP-II/WRM/WK-{weekNo}<br />Date: {new Date().toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' })}</div>
            </div>

            <h3 className="text-[10px] font-bold uppercase mb-1">1. Meeting Participants & Site Operational Data</h3>
            <table className="mb-4">
              <thead><tr><th className="w-[35%]">Employer Representatives (NTPC)</th><th className="w-[35%]">Contractor Representatives (M/s TPL)</th><th className="w-[30%] text-center">Site Operational Metrics</th></tr></thead>
              <tbody>
                <tr>
                  <td className="align-top"><ul className="list-disc pl-4 m-0">{(currentMeta.ntpcAttendees || []).filter(a => a.name).map((a, i) => <li key={i}><strong>{a.name}</strong> — {a.desig}</li>)}</ul></td>
                  <td className="align-top"><ul className="list-disc pl-4 m-0">{(currentMeta.tplAttendees || []).filter(a => a.name).map((a, i) => <li key={i}><strong>{a.name}</strong> — {a.desig}</li>)}</ul></td>
                  <td className="align-top font-bold text-center bg-[#f1f5f9] text-[11px] pt-3">Total Deployed Manpower: {currentMeta.manpower}<br/><br/>Total Persons Trained: {currentMeta.trained}</td>
                </tr>
              </tbody>
            </table>

            {printIncludeDashboard && (
              <React.Fragment>
                <h3 className="text-[10px] font-bold uppercase mb-1">2. Executive Dashboard Summary</h3>
                <table className="mb-4">
                  <thead><tr><th>Civil Targets Hit</th><th>Mech Targets Hit</th><th>Elec Targets Hit</th><th>Pending Drawings</th><th>Open Bottlenecks</th><th>Open HSE Issues</th></tr></thead>
                  <tbody>
                    <tr>
                      <td className="text-center font-bold text-blue-900">{getHitCount(civilWk)} / {civilWk.length}</td>
                      <td className="text-center font-bold text-amber-700">{getHitCount(mechWk)} / {mechWk.length}</td>
                      <td className="text-center font-bold text-emerald-800">{getHitCount(elecWk)} / {elecWk.length}</td>
                      <td className="text-center font-bold">{pendingDwgs}</td>
                      <td className="text-center font-bold text-rose-700">{openActs}</td>
                      <td className="text-center font-bold">{openHse}</td>
                    </tr>
                  </tbody>
                </table>
              </React.Fragment>
            )}

            <h3 className="text-[10px] font-bold uppercase mb-1">{printIncludeDashboard ? "3" : "2"}. Discipline Execution Performance</h3>
            <table className="mb-4">
              <thead><tr><th className="w-[22%]">Work Front & Task</th><th className="text-center w-10">Plan</th><th className="text-center w-10">Actual</th><th className="text-center w-10">Var.</th><th className="text-center w-10">Cum. BL</th><th className="w-[18%]">Reported Hindrance</th><th className="w-[18%]">TPL Remarks</th><th className="w-[18%]">NTPC Directives</th></tr></thead>
              <tbody>
                {[...db.civilExecution, ...db.mechExecution, ...db.elecExecution].filter(t => t.weekNo === weekNo).map((c, i) => (
                  <tr key={i}>
                    <td><strong>{c.l2Ref}</strong><br/>{c.taskName} ({c.unit})</td>
                    <td className="text-center font-bold text-blue-900">{c.plan}</td>
                    <td className="text-center font-bold text-emerald-800">{c.act}</td>
                    <td className="text-center font-black">{(parseFloat(c.act) || 0) - (parseFloat(c.plan) || 0)}</td>
                    <td className="text-center font-bold text-rose-800">{c.cumBacklog}</td>
                    <td>{c.hindrance}</td><td>{c.tplRemarks}</td><td className="font-bold">{c.ntpcDirectives}</td>
                  </tr>
                ))}
              </tbody>
            </table>

            <h3 className="text-[10px] font-bold uppercase mb-1">{printIncludeDashboard ? "4" : "3"}. Priority Actions & Bottlenecks</h3>
            <table className="mb-6">
              <thead><tr><th className="w-[30%]">Action Description</th><th className="w-[12%]">Resp</th><th className="text-center w-[12%]">Target</th><th className="text-center w-[12%]">Status</th><th className="w-[34%]">NTPC Review Directives</th></tr></thead>
              <tbody>
                {db.actions.filter(a => a.weekNo === weekNo).map((a, i) => (
                  <tr key={i}>
                    <td><strong>{a.desc}</strong></td><td>{a.responsibility}</td>
                    <td className="text-center font-bold">{a.targetDate}</td><td className="text-center font-bold uppercase">{a.status}</td>
                    <td className="font-bold">{a.ntpcRemarks}</td>
                  </tr>
                ))}
              </tbody>
            </table>

            <div className="mt-12 flex justify-between text-[10px] font-bold uppercase px-12">
              <div className="text-center">____________________________________<br/><br/>Employer Representative<br/><strong>(NTPC Limited)</strong></div>
              <div className="text-center">____________________________________<br/><br/>Contractor Representative<br/><strong>(M/s TPL)</strong></div>
            </div>
          </div>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
