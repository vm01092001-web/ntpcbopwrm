<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nabinagar STPP Stage-II — Enterprise WRM Portal</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ntpc: { blue: '#0066b3', navy: '#06163a', orange: '#ea580c' }
          },
          fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] }
        }
      }
    };
  </script>

  <style>
    body { background-color: #f8fafc; font-feature-settings: "cv02", "cv03", "cv04", "cv11"; }
    .fade-in { animation: fadeIn 0.15s ease-out forwards; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    .custom-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scroll::-webkit-scrollbar-track { background: transparent; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    .sticky-th { position: sticky; top: 0; z-index: 20; }
    .sticky-th-sub { position: sticky; top: 28px; z-index: 19; }

    @media print {
      body { background: white !important; font-family: 'Arial', sans-serif; }
      .no-print { display: none !important; }
      #printable-mom { display: block !important; width: 100% !important; color: black !important; }
      @page { size: A4 landscape; margin: 8mm; }
      table { border-collapse: collapse; width: 100%; page-break-inside: auto; margin-bottom: 12px; }
      tr { page-break-inside: avoid; page-break-after: auto; }
      th { background-color: #f1f5f9 !important; color: #000 !important; font-weight: bold; border: 1px solid #94a3b8; padding: 4px; font-size: 8.5px; }
      td { border: 1px solid #94a3b8; padding: 4px; font-size: 8px; }
      .print-header-container { display: flex; align-items: center; justify-content: space-between; border-bottom: 1.5px solid #d1d5db; padding-bottom: 6px; margin-bottom: 10px; }
      .print-title { color: #0066b3; font-size: 20px; font-weight: 900; letter-spacing: -0.5px; margin: 0; }
      .print-subtitle { font-size: 9.5px; font-style: italic; font-weight: bold; margin-top: 1px; }
      .print-logo { height: 42px; }
      .header-gradient-line { height: 2px; background: linear-gradient(to right, rgba(0,0,0,0) 0%, rgba(133,184,107,1) 50%, rgba(0,0,0,0) 100%); margin: 3px 0; }
    }
  </style>
</head>
<body class="text-slate-800 antialiased overflow-hidden">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useCallback } = React;

    const STORAGE_KEY = "ntpc_nabinagar_wrm_db_v2";

    const DEFAULT_SEED_DATA = {
      currentWeek: 35,
      weeks: [35],
      weekMeta: {
        "35": {
          isLocked: false,
          manpower: 480,
          trained: 360,
          ntpcAttendees: [{ name: "Sri Krishna", desig: "Executive Engineer" }],
          tplAttendees: [{ name: "R. K. Sharma", desig: "Project Manager" }]
        }
      },
      teamMaster: [
        { empId: "NTPC01", name: "Sri Krishna", desig: "Executive Engineer", dept: "Civil", org: "NTPC" },
        { empId: "NTPC02", name: "A. K. Verma", desig: "DGM", dept: "BOP Civil", org: "NTPC" },
        { empId: "TPL01", name: "R. K. Sharma", desig: "Project Manager", dept: "Execution", org: "TPL" },
        { empId: "TPL02", name: "S. Chatterjee", desig: "Planning Lead", dept: "Planning", org: "TPL" }
      ],
      l2Schedule: [
        { id: "L2-01", discipline: "Civil", desc: "Boiler Area Foundation Raft", l2Start: "2026-07-01", actStart: "2026-07-10", l2End: "2026-08-15", actEnd: "2026-08-28" },
        { id: "L2-02", discipline: "Mechanical", desc: "Turbine House EOT Crane Girders", l2Start: "2026-08-01", actStart: "2026-08-05", l2End: "2026-09-10", actEnd: "" },
        { id: "L2-03", discipline: "Electrical", desc: "Switchyard 400kV Cable Trench Laying", l2Start: "2026-08-10", actStart: "2026-08-22", l2End: "2026-08-30", actEnd: "" }
      ],
      civilExecution: [
        { id: "CV-01", weekNo: 35, l2Ref: "Boiler Area Foundation Raft", taskName: "RCC M35 Raft Pouring", unit: "m³", plan: 850, act: 620, next: 900, cumBacklog: 230, hindrance: "Ready mix pump breakdown on Day 3", tplRemarks: "Additional transit mixer mobilized", ntpcDirectives: "Expedite pour to avoid cold joints", milestone: "In Progress" }
      ],
      mechExecution: [
        { id: "MC-01", weekNo: 35, l2Ref: "Turbine House EOT Crane Girders", taskName: "Girder Alignment & Torque Check", unit: "MT", plan: 120, act: 120, next: 150, cumBacklog: 0, hindrance: "", tplRemarks: "On track", ntpcDirectives: "Submit calibration certificates", milestone: "Completed" }
      ],
      elecExecution: [
        { id: "EL-01", weekNo: 35, l2Ref: "Switchyard 400kV Cable Trench Laying", taskName: "Pre-cast Slab Placement", unit: "m", plan: 250, act: 180, next: 300, cumBacklog: 70, hindrance: "Waterlogging following monsoon showers", tplRemarks: "Dewatering pumps deployed", ntpcDirectives: "Ensure trench gravel bed drying", milestone: "In Progress" }
      ],
      drawings: [
        { id: "DW-01", weekNo: 35, discipline: "Civil", drawingNo: "NSTPP-II-CV-BLR-0412", desc: "Unit 4 Boiler Raft Reinforcement GA", priority: "High", targetDate: "2026-08-10", expectedDate: "2026-08-14", status: "Cat-1 Approved", frontImpact: "Clearance for pour", remarks: "Approved with technical comments" }
      ],
      safetyLogs: [
        { id: "SAF-01", weekNo: 35, category: "Unsafe Condition", desc: "Missing perimeter edge barrier at Boiler +8.5m floor deck", status: "Open", photoUrl: "" }
      ],
      qualityLogs: [
        { id: "QAL-01", weekNo: 35, category: "Civil NCR", desc: "Honeycombing observed on Transformer Pedestal Face #2", status: "Complied", photoUrl: "" }
      ],
      actions: [
        { id: "ACT-01", weekNo: 35, category: "Execution", desc: "Deployment of extra certified welders for high-pressure piping", responsibility: "TPL", targetDate: "2026-08-25", revisedDate: "2026-08-30", status: "In Progress", ntpcRemarks: "Critical path activity; penalty clause applies" }
      ]
    };

    const ProgressRing = ({ pct, color, label, subtext }) => {
      const radius = 28;
      const circumference = 2 * Math.PI * radius;
      return (
        <div className="flex items-center gap-3 bg-white p-3.5 rounded-xl border border-slate-200/80 shadow-sm">
          <div className="relative w-14 h-14 flex items-center justify-center flex-shrink-0">
            <svg className="transform -rotate-90 w-full h-full">
              <circle cx="28" cy="28" r={radius} stroke="#e2e8f0" strokeWidth="4.5" fill="transparent" />
              <circle cx="28" cy="28" r={radius} stroke="currentColor" strokeWidth="4.5" fill="transparent"
                strokeDasharray={circumference}
                strokeDashoffset={circumference - (Math.min(100, Math.max(0, pct)) / 100) * circumference}
                strokeLinecap="round" className={`transition-all duration-700 ease-out ${color}`} />
            </svg>
            <span className="absolute text-xs font-black tracking-tight">{pct}%</span>
          </div>
          <div>
            <div className="text-[10px] font-bold text-slate-400 uppercase tracking-wider">{label}</div>
            <div className="text-xs font-black text-slate-800 mt-0.5">{subtext}</div>
          </div>
        </div>
      );
    };

    const DelayTracker = ({ title, tasks, discipline, l2Schedule }) => {
      const delayedTasks = tasks.map(t => {
        if (!t.l2Ref) return null;
        const l2 = l2Schedule.find(l => l.desc === t.l2Ref && l.discipline === discipline);
        if (!l2) return null;
        
        const endL2 = l2.l2End ? new Date(l2.l2End) : null;
        const endAct = l2.actEnd ? new Date(l2.actEnd) : null;
        const startL2 = l2.l2Start ? new Date(l2.l2Start) : null;
        const startAct = l2.actStart ? new Date(l2.actStart) : null;
        const today = new Date();
        today.setHours(0,0,0,0);

        let delayType = null, targetDisplay = "", actualDisplay = "";

        if (endL2) {
          endL2.setHours(0,0,0,0);
          if (endAct) {
            endAct.setHours(0,0,0,0);
            if (endAct > endL2) { delayType = "Finish Delayed"; targetDisplay = l2.l2End; actualDisplay = l2.actEnd; }
          } else if (today > endL2) {
            delayType = "Finish Overdue"; targetDisplay = l2.l2End; actualDisplay = "Incomplete";
          }
        }
        if (!delayType && startL2) {
          startL2.setHours(0,0,0,0);
          if (startAct) {
            startAct.setHours(0,0,0,0);
            if (startAct > startL2) { delayType = "Start Delayed"; targetDisplay = l2.l2Start; actualDisplay = l2.actStart; }
          } else if (today > startL2) {
            delayType = "Start Overdue"; targetDisplay = l2.l2Start; actualDisplay = "Not Started";
          }
        }
        if (!delayType) return null;

        return { taskName: t.taskName, l2Ref: t.l2Ref, targetDisplay, actualDisplay, hindrance: t.hindrance || "No specific hindrance documented", delayType };
      }).filter(Boolean);

      if (delayedTasks.length === 0) {
        return (
          <div className="mt-3 p-2.5 border border-emerald-200 bg-emerald-50/50 rounded-xl flex items-center justify-between">
            <h4 className="text-[11px] font-black uppercase tracking-wider text-emerald-800">{title}</h4>
            <span className="text-[9px] font-bold text-emerald-700 bg-emerald-100 px-2 py-0.5 rounded">✓ Work Fronts On Schedule</span>
          </div>
        );
      }

      return (
        <div className="mt-3 border border-rose-200 bg-white rounded-xl overflow-hidden shadow-sm">
          <div className="bg-rose-50 px-3.5 py-1.5 border-b border-rose-200 flex justify-between items-center">
            <h4 className="text-[11px] font-black uppercase tracking-wider text-rose-800">{title} Schedule Slips</h4>
            <span className="text-[9px] font-bold text-rose-600 bg-rose-200 px-2 py-0.5 rounded-full">{delayedTasks.length} Fronts Impacted</span>
          </div>
          <table className="w-full text-left text-[10px]">
            <thead className="bg-rose-50/50">
              <tr className="text-rose-900/70 uppercase">
                <th className="py-1 px-3 w-[15%]">Slip Nature</th>
                <th className="py-1 px-3 w-[25%]">Work Front & Task</th>
                <th className="py-1 px-3 w-[12%]">Target</th>
                <th className="py-1 px-3 w-[13%] text-rose-600">Actual/Status</th>
                <th className="py-1 px-3 w-[35%]">Primary Hindrance Cause</th>
              </tr>
            </thead>
            <tbody className="divide-y divide-rose-100">
              {delayedTasks.map((d, i) => (
                <tr key={i} className="text-rose-950 font-bold hover:bg-rose-50/30">
                  <td className="py-1.5 px-3"><span className="bg-rose-100 text-rose-700 px-1.5 py-0.5 rounded text-[9px]">{d.delayType}</span></td>
                  <td className="py-1.5 px-3"><strong>{d.l2Ref}</strong><br/><span className="text-slate-500">{d.taskName}</span></td>
                  <td className="py-1.5 px-3 text-slate-600">{d.targetDisplay}</td>
                  <td className="py-1.5 px-3"><span className="text-white bg-rose-600 px-2 py-0.5 rounded text-[9px]">{d.actualDisplay}</span></td>
                  <td className="py-1.5 px-3 text-rose-800">{d.hindrance}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      );
    };

    function App() {
      const [db, setDb] = useState(() => {
        const local = localStorage.getItem(STORAGE_KEY);
        if (local) {
          try { return JSON.parse(local); } catch(e) { console.error(e); }
        }
        return DEFAULT_SEED_DATA;
      });

      const [role, setRole] = useState("NTPC");
      const [tab, setTab] = useState("DASHBOARD");
      const [weekNo, setWeekNo] = useState(db.currentWeek || 35);
      const [activeDiscipline, setActiveDiscipline] = useState("Civil");
      const [statusMsg, setStatusMsg] = useState("Active Local Engine (<1ms)");

      const [showNewWeekModal, setShowNewWeekModal] = useState(false);
      const [newWeekInput, setNewWeekInput] = useState(36);
      const [showLogModal, setShowLogModal] = useState(false);
      const [logForm, setLogForm] = useState({ type: "Safety", category: "Unsafe Condition", desc: "", file: null });
      const [viewImage, setViewImage] = useState(null);

      useEffect(() => {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
      }, [db]);

      const currentMeta = db.weekMeta[weekNo] || { isLocked: false, manpower: 0, trained: 0, ntpcAttendees: [], tplAttendees: [] };
      const isLocked = Boolean(currentMeta.isLocked);
      const isTplDisabled = role === "TPL" && isLocked;

      const activeTasks = useMemo(() => {
        const source = activeDiscipline === "Civil" ? db.civilExecution : activeDiscipline === "Mechanical" ? db.mechExecution : db.elecExecution;
        return source.filter(t => t.weekNo === weekNo);
      }, [db, activeDiscipline, weekNo]);

      const activeDrawings = useMemo(() => db.drawings.filter(d => d.weekNo === weekNo), [db.drawings, weekNo]);
      const activeActions = useMemo(() => db.actions.filter(a => a.weekNo === weekNo), [db.actions, weekNo]);
      const activeSafety = useMemo(() => db.safetyLogs.filter(s => s.weekNo === weekNo), [db.safetyLogs, weekNo]);
      const activeQuality = useMemo(() => db.qualityLogs.filter(q => q.weekNo === weekNo), [db.qualityLogs, weekNo]);

      const handleTaskChange = (taskId, field, val) => {
        const collection = activeDiscipline === "Civil" ? "civilExecution" : activeDiscipline === "Mechanical" ? "mechExecution" : "elecExecution";
        setDb(prev => {
          const updated = prev[collection].map(item => {
            if (item.id !== taskId) return item;
            const nextItem = { ...item, [field]: val };
            if (field === 'plan' || field === 'act') {
              const p = parseFloat(field === 'plan' ? val : nextItem.plan) || 0;
              const a = parseFloat(field === 'act' ? val : nextItem.act) || 0;
              const shortfall = Math.max(0, p - a);
              nextItem.computedVariance = a - p;
            }
            return nextItem;
          });
          return { ...prev, [collection]: updated };
        });
      };

      const handleAddTask = () => {
        const collection = activeDiscipline === "Civil" ? "civilExecution" : activeDiscipline === "Mechanical" ? "mechExecution" : "elecExecution";
        const prefix = activeDiscipline === "Civil" ? "CV-" : activeDiscipline === "Mechanical" ? "MC-" : "EL-";
        const newItem = {
          id: prefix + Math.random().toString(36).substr(2, 6).toUpperCase(),
          weekNo: weekNo,
          l2Ref: "",
          taskName: "",
          unit: activeDiscipline === "Civil" ? "m³" : activeDiscipline === "Mechanical" ? "MT" : "m",
          plan: 0,
          act: 0,
          next: 0,
          cumBacklog: 0,
          hindrance: "",
          tplRemarks: "",
          ntpcDirectives: "",
          milestone: "In Progress"
        };
        setDb(prev => ({ ...prev, [collection]: [...prev[collection], newItem] }));
      };

      const handleToggleLock = () => {
        if (role !== "NTPC") return;
        setDb(prev => ({
          ...prev,
          weekMeta: {
            ...prev.weekMeta,
            [weekNo]: { ...currentMeta, isLocked: !isLocked }
          }
        }));
      };

      const handleUpdateMeta = (field, val) => {
        setDb(prev => ({
          ...prev,
          weekMeta: {
            ...prev.weekMeta,
            [weekNo]: { ...currentMeta, [field]: val }
          }
        }));
      };

      const handleCreateWeek = () => {
        const newWk = parseInt(newWeekInput);
        if (db.weeks.includes(newWk)) { alert("Week already exists"); return; }

        setDb(prev => {
          const lastMeta = prev.weekMeta[weekNo] || {};
          const rollExec = (arr) => arr.filter(t => t.weekNo === weekNo && t.milestone !== "Completed").map(t => {
            const shortfall = Math.max(0, (parseFloat(t.plan) || 0) - (parseFloat(t.act) || 0));
            return {
              ...t,
              id: t.id.split('-')[0] + '-' + Math.random().toString(36).substr(2, 6).toUpperCase(),
              weekNo: newWk,
              plan: parseFloat(t.next) || 0,
              act: 0,
              next: 0,
              cumBacklog: (parseFloat(t.cumBacklog) || 0) + shortfall,
              hindrance: "",
              tplRemarks: "",
              ntpcDirectives: ""
            };
          });

          const rollDrawings = prev.drawings.filter(d => d.weekNo === weekNo && d.status !== "Cat-1 Approved").map(d => ({
            ...d,
            id: "DW-" + Math.random().toString(36).substr(2, 6).toUpperCase(),
            weekNo: newWk
          }));

          const rollActions = prev.actions.filter(a => a.weekNo === weekNo && a.status !== "Completed").map(a => ({
            ...a,
            id: "ACT-" + Math.random().toString(36).substr(2, 6).toUpperCase(),
            weekNo: newWk
          }));

          return {
            ...prev,
            currentWeek: newWk,
            weeks: [newWk, ...prev.weeks],
            weekMeta: {
              ...prev.weekMeta,
              [newWk]: {
                isLocked: false,
                manpower: lastMeta.manpower || 0,
                trained: lastMeta.trained || 0,
                ntpcAttendees: lastMeta.ntpcAttendees ? [...lastMeta.ntpcAttendees] : [],
                tplAttendees: lastMeta.tplAttendees ? [...lastMeta.tplAttendees] : []
              }
            },
            civilExecution: [...prev.civilExecution, ...rollExec(prev.civilExecution)],
            mechExecution: [...prev.mechExecution, ...rollExec(prev.mechExecution)],
            elecExecution: [...prev.elecExecution, ...rollExec(prev.elecExecution)],
            drawings: [...prev.drawings, ...rollDrawings],
            actions: [...prev.actions, ...rollActions]
          };
        });

        setWeekNo(newWk);
        setShowNewWeekModal(false);
      };

      const handleSaveLog = () => {
        if (!logForm.desc) return alert("Enter observation description");
        const reader = new FileReader();
        const executeSave = (b64) => {
          const collection = logForm.type === "Safety" ? "safetyLogs" : "qualityLogs";
          const prefix = logForm.type === "Safety" ? "SAF-" : "QAL-";
          const newEntry = {
            id: prefix + Math.random().toString(36).substr(2, 6).toUpperCase(),
            weekNo,
            category: logForm.category,
            desc: logForm.desc,
            status: "Open",
            photoUrl: b64 || ""
          };
          setDb(prev => ({ ...prev, [collection]: [newEntry, ...prev[collection]] }));
          setShowLogModal(false);
          setLogForm({ type: "Safety", category: "Unsafe Condition", desc: "", file: null });
        };

        if (logForm.file) {
          reader.onload = () => executeSave(reader.result);
          reader.readAsDataURL(logForm.file);
        } else {
          executeSave("");
        }
      };

      const exportBackup = () => {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(db, null, 2));
        const a = document.createElement('a');
        a.setAttribute("href", dataStr);
        a.setAttribute("download", `NTPC_WRM_Backup_Wk${weekNo}_${new Date().toISOString().split('T')[0]}.json`);
        document.body.appendChild(a);
        a.click();
        a.remove();
      };

      const importBackup = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const parsed = JSON.parse(event.target.result);
            if (parsed.weekMeta && parsed.civilExecution) {
              setDb(parsed);
              setWeekNo(parsed.currentWeek || 35);
              alert("Backup restored successfully");
            } else {
              alert("Invalid WRM backup schema");
            }
          } catch(err) {
            alert("Error parsing file: " + err.message);
          }
        };
        reader.readAsText(file);
      };

      const calcDisciplineProgress = (tasks) => {
        if (!tasks.length) return 0;
        const p = tasks.reduce((acc, t) => acc + (parseFloat(t.plan) || 0), 0);
        const a = tasks.reduce((acc, t) => acc + (parseFloat(t.act) || 0), 0);
        return p === 0 ? 0 : Math.min(100, Math.round((a / p) * 100));
      };

      return (
        <div className="flex h-screen w-screen bg-slate-50 overflow-hidden font-sans">
          
          {/* SIDEBAR NAVIGATION */}
          <aside className="w-60 bg-ntpc-navy text-white flex flex-col h-screen shadow-2xl flex-shrink-0 z-50 no-print">
            <div className="p-4 flex items-center gap-3 border-b border-white/10">
              <div className="w-9 h-9 bg-ntpc-orange text-white rounded-xl flex items-center justify-center font-black text-xl shadow-md border border-white/20">N</div>
              <div>
                <h1 className="text-xs font-black uppercase tracking-wider leading-none">Nabinagar STPP</h1>
                <p className="text-[9px] text-orange-400 font-bold uppercase tracking-widest mt-1">Stage-II WRM Portal</p>
              </div>
            </div>

            <nav className="flex-1 px-3 py-4 space-y-1 overflow-y-auto custom-scroll">
              {[
                { id: "DASHBOARD", icon: "📊", label: "Executive Summary" },
                { id: "L2 SCHEDULE", icon: "📅", label: "L2 Master Fronts" },
                { id: "EXECUTION", icon: "🏗️", label: "Discipline Execution" },
                { id: "DRAWINGS", icon: "📐", label: "Engineering & DCI" },
                { id: "HSE & QA", icon: "🛡️", label: "HSE & Quality NCR" },
                { id: "ACTIONS", icon: "⚡", label: "Bottlenecks Tracker" }
              ].map(m => (
                <button key={m.id} onClick={() => setTab(m.id)}
                  className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-[11px] font-black uppercase tracking-wider transition-all ${tab === m.id ? "bg-ntpc-orange text-white shadow-md" : "text-slate-400 hover:bg-white/5 hover:text-white"}`}>
                  <span className="text-base">{m.icon}</span>{m.label}
                </button>
              ))}
            </nav>

            <div className="p-3 border-t border-white/10 space-y-2">
              <div className="flex items-center justify-between text-[10px] font-black uppercase text-slate-400">
                <span>Role Mode:</span>
                <button onClick={() => setRole(role === "NTPC" ? "TPL" : "NTPC")} className="px-2 py-0.5 bg-blue-600/30 text-blue-300 rounded border border-blue-400/30">{role}</button>
              </div>
              <div className="flex gap-2">
                <button onClick={exportBackup} title="Save backup file to laptop" className="flex-1 bg-white/10 hover:bg-white/20 text-white py-1.5 rounded text-[9px] font-black uppercase">Export .JSON</button>
                <label className="flex-1 bg-white/10 hover:bg-white/20 text-white py-1.5 rounded text-[9px] font-black uppercase text-center cursor-pointer">
                  Import<input type="file" accept=".json" onChange={importBackup} className="hidden" />
                </label>
              </div>
            </div>
          </aside>

          {/* MAIN WORKSPACE */}
          <div className="flex-1 flex flex-col h-full overflow-hidden">
            
            {/* TOP BAR */}

                    <div className="flex items-center gap-6">
                      <div><label className="text-[9px] font-bold uppercase text-slate-400 block">Total Site Manpower</label><input type="number" value={currentMeta.manpower} onChange={e => handleUpdateMeta("manpower", parseInt(e.target.value) || 0)} className="font-black text-xl text-ntpc-blue bg-slate-50 border rounded p-1 w-24 outline-none" /></div>
                      <div><label className="text-[9px] font-bold uppercase text-slate-400 block">Total Persons Trained</label><input type="number" value={currentMeta.trained} onChange={e => handleUpdateMeta("trained", parseInt(e.target.value) || 0)} className="font-black text-xl text-emerald-600 bg-slate-50 border rounded p-1 w-24 outline-none" /></div>
                    </div>
                    <button onClick={() => setShowLogModal(true)} disabled={isTplDisabled} className="bg-ntpc-orange text-white px-3.5 py-1.5 rounded-lg text-xs font-black uppercase shadow">+ Log Site Violation</button>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                      <h3 className="text-xs font-black text-orange-600 uppercase tracking-wider mb-2">HSE Safety Violations</h3>
                      <div className="space-y-2 max-h-[480px] overflow-y-auto pr-1 custom-scroll">
                        {activeSafety.map(s => (
                          <div key={s.id} className="p-3 bg-slate-50 border rounded-lg space-y-1.5">
                            <div className="flex justify-between items-center"><span className="text-xs font-black text-ntpc-blue">{s.id} • {s.category}</span><button onClick={() => { if (role !== "NTPC") return; const next = s.status === 'Open' ? 'Complied' : 'Open'; const copy = db.safetyLogs.map(item => item.id === s.id ? { ...item, status: next } : item); setDb({ ...db, safetyLogs: copy }); }} className={`px-2 py-0.5 rounded text-[9px] font-black uppercase ${s.status === 'Complied' ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800'}`}>{s.status === 'Complied' ? '✓ Complied' : '⚠ Open'}</button></div>
                            <p className="text-xs text-slate-700">{s.desc}</p>
                            {s.photoUrl && <button onClick={() => setViewImage(s.photoUrl)} className="text-blue-600 font-bold text-[10px] underline uppercase">View Attached Evidence</button>}
                          </div>
                        ))}
                      </div>
                    </div>

                    <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                      <h3 className="text-xs font-black text-blue-600 uppercase tracking-wider mb-2">Quality Assurance (FQA) NCRs</h3>
                      <div className="space-y-2 max-h-[480px] overflow-y-auto pr-1 custom-scroll">
                        {activeQuality.map(q => (
                          <div key={q.id} className="p-3 bg-slate-50 border rounded-lg space-y-1.5">
                            <div className="flex justify-between items-center"><span className="text-xs font-black text-ntpc-blue">{q.id} • {q.category}</span><button onClick={() => { if (role !== "NTPC") return; const next = q.status === 'Open' ? 'Complied' : 'Open'; const copy = db.qualityLogs.map(item => item.id === q.id ? { ...item, status: next } : item); setDb({ ...db, qualityLogs: copy }); }} className={`px-2 py-0.5 rounded text-[9px] font-black uppercase ${q.status === 'Complied' ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800'}`}>{q.status === 'Complied' ? '✓ Complied' : '⚠ Open'}</button></div>
                            <p className="text-xs text-slate-700">{q.desc}</p>
                            {q.photoUrl && <button onClick={() => setViewImage(q.photoUrl)} className="text-blue-600 font-bold text-[10px] underline uppercase">View Attached Evidence</button>}
                          </div>
                        ))}
                      </div>
                    </div>
                  </div>
                </div>
              )}

              {/* TAB: ACTIONS */}
              {tab === "ACTIONS" && (
                <div className="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden fade-in">
                  <div className="p-3 bg-slate-50 border-b border-slate-200 flex justify-between items-center">
                    <h2 className="text-xs font-black text-ntpc-blue uppercase tracking-wider">Critical Bottlenecks & Action Tracker</h2>
                    <button onClick={() => {
                      const newA = { id: "ACT-" + Math.random().toString(36).substr(2, 6).toUpperCase(), weekNo, category: "Execution", desc: "", responsibility: "TPL", targetDate: "", revisedDate: "", status: "Pending", ntpcRemarks: "" };
                      setDb(prev => ({ ...prev, actions: [newA, ...prev.actions] }));
                    }} disabled={isTplDisabled} className="bg-ntpc-orange text-white px-3 py-1 rounded-lg text-xs font-black uppercase">+ Add Action Item</button>
                  </div>
                  <table className="w-full text-left text-xs">
                    <thead><tr className="bg-ntpc-navy text-white text-[9px] uppercase tracking-wider sticky-th"><th className="p-2.5 w-[10%]">Category</th><th className="p-2.5 w-[26%]">Action Item Description</th><th className="p-2.5 w-[10%]">Resp</th><th className="p-2.5 text-center w-[10%]">Target</th><th className="p-2.5 text-center w-[10%]">Revised</th><th className="p-2.5 text-center w-[10%]">Status</th><th className="p-2.5 w-[24%]">NTPC Review Remarks</th></tr></thead>
                    <tbody className="divide-y divide-slate-100">
                      {activeActions.map(a => (
                        <tr key={a.id} className="hover:bg-slate-50">
                          <td className="p-2"><select disabled={isTplDisabled} value={a.category} onChange={e => { const copy = db.actions.map(item => item.id === a.id ? { ...item, category: e.target.value } : item); setDb({ ...db, actions: copy }); }} className="w-full bg-slate-100 rounded p-1 font-bold text-[10px]"><option>Execution</option><option>Engineering</option><option>Procurement</option><option>Clearance</option></select></td>
                          <td className="p-2"><input type="text" disabled={isTplDisabled} value={a.desc} onChange={e => { const copy = db.actions.map(item => item.id === a.id ? { ...item, desc: e.target.value } : item); setDb({ ...db, actions: copy }); }} className="w-full bg-transparent border-b font-bold text-[11px]" /></td>
                          <td className="p-2"><input type="text" disabled={isTplDisabled} value={a.responsibility} onChange={e => { const copy = db.actions.map(item => item.id === a.id ? { ...item, responsibility: e.target.value } : item); setDb({ ...db, actions: copy }); }} className="w-full bg-slate-100 font-bold p-1 rounded text-[10px]" /></td>
                          <td className="p-2 text-center"><input type="date" disabled={isTplDisabled} value={a.targetDate} onChange={e => { const copy = db.actions.map(item => item.id === a.id ? { ...item, targetDate: e.target.value } : item); setDb({ ...db, actions: copy }); }} className="bg-slate-100 p-1 rounded text-[9.5px] font-bold" /></td>
                          <td className="p-2 text-center"><input type="date" disabled={role === "TPL"} value={a.revisedDate} onChange={e => { const copy = db.actions.map(item => item.id === a.id ? { ...item, revisedDate: e.target.value } : item); setDb({ ...db, actions: copy }); }} className="bg-amber-50 text-amber-800 p-1 rounded text-[9.5px] font-bold" /></td>
                          <td className="p-2 text-center"><button onClick={() => { if (role !== "NTPC") return; const next = a.status === 'Pending' ? 'In Progress' : a.status === 'In Progress' ? 'Completed' : 'Pending'; const copy = db.actions.map(item => item.id === a.id ? { ...item, status: next } : item); setDb({ ...db, actions: copy }); }} className={`px-2 py-1 rounded text-[9px] font-black uppercase w-full ${a.status === 'Completed' ? 'bg-emerald-100 text-emerald-800' : a.status === 'In Progress' ? 'bg-amber-100 text-amber-800' : 'bg-rose-100 text-rose-800'}`}>{a.status}</button></td>
                          <td className="p-2"><textarea rows="1" disabled={role === "TPL"} value={a.ntpcRemarks} onChange={e => { const copy = db.actions.map(item => item.id === a.id ? { ...item, ntpcRemarks: e.target.value } : item); setDb({ ...db, actions: copy }); }} className="w-full bg-rose-50/20 border border-slate-200 rounded p-1 text-[9.5px] text-rose-950 font-bold" /></td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              )}
            </main>
          </div>

          {/* MODALS */}
          {showNewWeekModal && (
            <div className="fixed inset-0 bg-slate-950/70 backdrop-blur-sm z-50 flex items-center justify-center p-4 fade-in">
              <div className="bg-white rounded-2xl p-5 max-w-xs w-full shadow-2xl space-y-3">
                <h3 className="text-xs font-black uppercase text-ntpc-blue">Initialize Review Week</h3>
                <p className="text-[10px] text-slate-500 font-bold">Incomplete items, cumulative backlogs, and drawing registers will automatically carry forward.</p>
                <input type="number" value={newWeekInput} onChange={e => setNewWeekInput(e.target.value)} className="w-full border p-2 rounded text-sm font-black" />
                <div className="flex gap-2">
                  <button onClick={() => setShowNewWeekModal(false)} className="flex-1 bg-slate-100 py-1.5 rounded text-xs font-black uppercase">Cancel</button>
                  <button onClick={handleCreateWeek} className="flex-1 bg-ntpc-blue text-white py-1.5 rounded text-xs font-black uppercase shadow">Rollover</button>
                </div>
              </div>
            </div>
          )}

          {showLogModal && (
            <div className="fixed inset-0 bg-slate-950/70 backdrop-blur-sm z-50 flex items-center justify-center p-4 fade-in">
              <div className="bg-white rounded-2xl p-5 max-w-sm w-full shadow-2xl space-y-3">
                <h3 className="text-xs font-black uppercase text-ntpc-blue">Log Observation</h3>
                <select value={logForm.type} onChange={e => setLogForm({ ...logForm, type: e.target.value })} className="w-full border p-1.5 rounded text-xs font-bold"><option value="Safety">Safety Violation</option><option value="Quality">Quality NCR</option></select>
                <input type="text" value={logForm.category} onChange={e => setLogForm({ ...logForm, category: e.target.value })} placeholder="Classification (e.g. Unsafe Condition)" className="w-full border p-1.5 rounded text-xs font-bold" />
                <textarea rows="3" value={logForm.desc} onChange={e => setLogForm({ ...logForm, desc: e.target.value })} placeholder="Describe field issue..." className="w-full border p-1.5 rounded text-xs font-bold"></textarea>
                <input type="file" accept="image/*" onChange={e => setLogForm({ ...logForm, file: e.target.files[0] })} className="text-xs" />
                <div className="flex gap-2">
                  <button onClick={() => setShowLogModal(false)} className="flex-1 bg-slate-100 py-1.5 rounded text-xs font-black uppercase">Cancel</button>
                  <button onClick={handleSaveLog} className="flex-1 bg-ntpc-orange text-white py-1.5 rounded text-xs font-black uppercase shadow">Save Log</button>
                </div>
              </div>
            </div>
          )}

          {viewImage && (
            <div className="fixed inset-0 bg-slate-950/80 z-50 flex items-center justify-center p-4 fade-in">
              <div className="bg-white p-4 rounded-2xl max-w-xl w-full relative">
                <button onClick={() => setViewImage(null)} className="absolute top-2 right-3 text-xl font-bold">✕</button>
                <img src={viewImage} className="max-h-[70vh] mx-auto rounded-lg object-contain" alt="Evidence" />
              </div>
            </div>
          )}

          {/* PRINTABLE MINUTES OF MEETING (MoM) — A4 LANDSCAPE EXACT REPLICA */}
          <div id="printable-mom" className="hidden print:block font-sans bg-white text-black">
            <div className="print-header-container">
              <svg className="print-logo" viewBox="0 0 120 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect x="2" y="2" width="116" height="36" rx="6" stroke="#0066b3" strokeWidth="3"/>
                <text x="60" y="25" fill="#0066b3" fontSize="18" fontWeight="900" fontFamily="Arial" textAnchor="middle">एनटीपीसी / NTPC</text>
              </svg>
              <div className="text-right">
                <h1 className="print-title">Nabinagar Super Thermal Power Project</h1>
                <div className="header-gradient-line"></div>
                <div className="print-subtitle">1980 MW (Stage-I:3X660) & 2400 MW (Stage-II:3X800) under construction</div>
              </div>
            </div>

            <div className="flex justify-between items-end mb-3 pb-1 border-b border-black">
              <h2 className="text-[11px] font-black uppercase tracking-wider">Minutes of Weekly Review Meeting (WRM) — Review Week #{weekNo}</h2>
              <div className="text-[8px] font-bold text-right">REF: NTPC/NSTPP-II/WRM/WK-{weekNo}<br />Date: {new Date().toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' })}</div>
            </div>

            <h3 className="text-[9px] font-bold uppercase mb-1">1. Meeting Participants & Site Performance Index</h3>
            <table className="mb-3">
              <thead><tr><th className="w-[35%]">Employer Representatives (NTPC)</th><th className="w-[35%]">Contractor Representatives (M/s TPL)</th><th className="w-[30%] text-center">Site Metrics</th></tr></thead>
              <tbody>
                <tr>
                  <td className="align-top"><ul className="list-disc pl-4 m-0">{(currentMeta.ntpcAttendees || []).filter(a => a.name).map((a, i) => <li key={i}><strong>{a.name}</strong> — {a.desig}</li>)}</ul></td>
                  <td className="align-top"><ul className="list-disc pl-4 m-0">{(currentMeta.tplAttendees || []).filter(a => a.name).map((a, i) => <li key={i}><strong>{a.name}</strong> — {a.desig}</li>)}</ul></td>
                  <td className="align-top font-bold text-center bg-[#f1f5f9]">Total Deployed Manpower: {currentMeta.manpower}<br/>Total Persons Trained: {currentMeta.trained}</td>
                </tr>
              </tbody>
            </table>

            <h3 className="text-[9px] font-bold uppercase mb-1">2. Discipline Execution Performance</h3>
            <table className="mb-3">
              <thead><tr><th className="w-1/4">Work Front & Task</th><th className="text-center w-12">Plan</th><th className="text-center w-12">Actual</th><th className="text-center w-12">Var.</th><th className="text-center w-12">Cum. BL</th><th className="w-1/6">Reported Hindrance</th><th className="w-1/5">TPL Remarks</th><th className="w-1/5">NTPC Directives</th></tr></thead>
              <tbody>
                {[...db.civilExecution, ...db.mechExecution, ...db.elecExecution].filter(t => t.weekNo === weekNo).map((c, i) => (
                  <tr key={i}>
                    <td><strong>{c.l2Ref}</strong><br/>{c.taskName} ({c.unit})</td>
                    <td className="text-center">{c.plan}</td>
                    <td className="text-center font-bold">{c.act}</td>
                    <td className="text-center font-bold">{(parseFloat(c.act) || 0) - (parseFloat(c.plan) || 0)}</td>
                    <td className="text-center font-bold">{c.cumBacklog}</td>
                    <td>{c.hindrance}</td>
                    <td>{c.tplRemarks}</td>
                    <td className="font-bold">{c.ntpcDirectives}</td>
                  </tr>
                ))}
              </tbody>
            </table>

            <h3 className="text-[9px] font-bold uppercase mb-1">3. Priority Actions & Bottlenecks</h3>
            <table className="mb-6">
              <thead><tr><th className="w-[30%]">Action Description</th><th className="w-[10%]">Resp</th><th className="text-center w-[12%]">Target</th><th className="text-center w-[12%]">Status</th><th className="w-[36%]">NTPC Review Directives</th></tr></thead>
              <tbody>
                {activeActions.map((a, i) => (
                  <tr key={i}>
                    <td><strong>{a.desc}</strong></td>
                    <td>{a.responsibility}</td>
                    <td className="text-center">{a.revisedDate || a.targetDate}</td>
                    <td className="text-center font-bold uppercase">{a.status}</td>
                    <td className="font-bold">{a.ntpcRemarks}</td>
                  </tr>
                ))}
              </tbody>
            </table>

            <div className="mt-12 flex justify-between text-[9px] font-bold uppercase px-12">
              <div className="text-center">____________________________________<br/><br/>Employer Representative<br/><strong>(NTPC Limited)</strong></div>
              <div className="text-center">____________________________________<br/><br/>Contractor Representative<br/><strong>(M/s TPL)</strong></div>
            </div>
          </div>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
