<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NTPC Nabinagar STPP Stage-II — WRM Portal</title>
  
  <!-- Tailwind CSS & React 18 Engine -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ntpc: {
              blue: '#0a225c',
              navy: '#06163a',
              orange: '#ea580c',
              lightOrange: '#fff7ed',
              accent: '#2563eb'
            }
          },
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'sans-serif']
          }
        }
      }
    };
  </script>

  <style>
    body { background-color: #f8fafc; font-feature-settings: "cv02", "cv03", "cv04", "cv11"; }
    
    /* Smooth Transitions */
    .fade-in { animation: fadeIn 0.18s ease-out forwards; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

    /* Custom Table Scrollbar */
    .custom-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scroll::-webkit-scrollbar-track { background: #f1f5f9; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    .custom-scroll::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

    /* Sticky Headers */
    .sticky-th { position: sticky; top: 0; z-index: 20; }
    .sticky-th-sub { position: sticky; top: 28px; z-index: 19; }

    /* Print MoM Styles */
    @media print {
      body { background: white !important; font-family: 'Times New Roman', serif; }
      .no-print { display: none !important; }
      #printable-mom { display: block !important; width: 100% !important; color: black !important; }
      @page { size: A4 landscape; margin: 10mm; }
      table { border-collapse: collapse; width: 100%; page-break-inside: auto; }
      tr { page-break-inside: avoid; page-break-after: auto; }
      th { background-color: #f1f5f9 !important; color: #000 !important; font-weight: bold; border: 1px solid #94a3b8; padding: 4px 6px; font-size: 8.5px; }
      td { border: 1px solid #94a3b8; padding: 4px 6px; font-size: 8px; }
    }
  </style>
</head>
<body class="text-slate-800 antialiased selection:bg-orange-500 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useCallback } = React;

    // ========================================================
    // PASTE YOUR DEPLOYED GOOGLE APPS SCRIPT WEB APP URL HERE:
    // ========================================================
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbygEjkKhm45G9zNZVYWuVsswAOEyHNpikIwMSX6Mxt3T4aXBYRudBy2asghSKhgfC1p7Q/exec";

    const apiPost = async (payload) => {
      try {
        const res = await fetch(SCRIPT_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload)
        });
        return await res.json();
      } catch (err) {
        return { status: 500, error: err.message };
      }
    };

    const formatDate = (val) => {
      if (!val) return "";
      const d = new Date(val);
      if (isNaN(d.getTime())) return val;
      const localDate = new Date(d.getTime() - (d.getTimezoneOffset() * 60000));
      return localDate.toISOString().split('T')[0];
    };

    // Fast SVG Progress Donut
    const ProgressRing = ({ pct, color, label, subtext }) => {
      const radius = 32;
      const circumference = 2 * Math.PI * radius;
      const strokeDashoffset = circumference - (Math.min(100, Math.max(0, pct)) / 100) * circumference;
      
      return (
        <div class="flex items-center gap-3.5 bg-white p-4 rounded-xl border border-slate-200/80 shadow-[0_1px_3px_rgba(0,0,0,0.04)] hover:shadow-md transition-shadow">
          <div class="relative w-16 h-16 flex items-center justify-center flex-shrink-0">
            <svg class="transform -rotate-90 w-full h-full">
              <circle cx="32" cy="32" r={radius} stroke="#e2e8f0" strokeWidth="5" fill="transparent" />
              <circle cx="32" cy="32" r={radius} stroke="currentColor" strokeWidth="5" fill="transparent"
                strokeDasharray={circumference}
                strokeDashoffset={strokeDashoffset}
                strokeLinecap="round"
                class={`transition-all duration-700 ease-out ${color}`} />
            </svg>
            <span class="absolute text-xs font-black text-slate-800 tracking-tight">{pct}%</span>
          </div>
          <div>
            <div class="text-[11px] font-bold text-slate-400 uppercase tracking-wider">{label}</div>
            <div class="text-sm font-black text-slate-800 mt-0.5">{subtext}</div>
          </div>
        </div>
      );
    };

    function App() {
      // Auth State
      const [authState, setAuthState] = useState("LOGIN");
      const [loginForm, setLoginForm] = useState({ userId: "", password: "" });
      const [role, setRole] = useState("NTPC");

      // App & Navigation
      const [tab, setTab] = useState("DASHBOARD");
      const [weekNo, setWeekNo] = useState(35);
      const [availableWeeks, setAvailableWeeks] = useState([35]);
      const [isLocked, setIsLocked] = useState(false);
      const [activeDiscipline, setActiveDiscipline] = useState("Civil_Execution");
      const [activeChartTask, setActiveChartTask] = useState("Excavation");

      // UI States
      const [loading, setLoading] = useState(false);
      const [statusMsg, setStatusMsg] = useState("");
      const [showLogModal, setShowLogModal] = useState(false);
      const [showWeekModal, setShowWeekModal] = useState(false);
      const [newWeekInput, setNewWeekInput] = useState(36);

      // Media Viewer
      const [viewImageId, setViewImageId] = useState(null);
      const [viewImageData, setViewImageData] = useState(null);
      const [imageLoading, setImageLoading] = useState(false);

      // Form State
      const [logForm, setLogForm] = useState({ type: "Safety", category: "Unsafe Condition", desc: "", file: null });

      // Live Project Data Store
      const [attendees, setAttendees] = useState({ ntpc: [{ name: "", desig: "" }], tpl: [{ name: "", desig: "" }] });
      const [l2Schedule, setL2Schedule] = useState([]);
      const [civilTasks, setCivilTasks] = useState([]);
      const [mechTasks, setMechTasks] = useState([]);
      const [elecTasks, setElecTasks] = useState([]);
      const [civilHistory, setCivilHistory] = useState({});
      const [drawings, setDrawings] = useState([]);
      const [safetyLogs, setSafetyLogs] = useState([]);
      const [qualityLogs, setQualityLogs] = useState([]);
      const [actions, setActions] = useState([]);

      const presetCivilTasks = [
        "Excavation", "PCC", "RCC", "Backfilling", "Brickwork", 
        "Plastering", "Painting", "Drain PCC", "Drain RCC", "Drain Wall", "Piling"
      ];

      // Session Check
      useEffect(() => {
        const savedRole = localStorage.getItem("wrm_role");
        const savedUser = localStorage.getItem("wrm_userId");
        if (savedRole && savedUser) {
          setRole(savedRole);
          setAuthState("PORTAL");
        }
      }, []);

      // Data Synchronization
      const loadData = useCallback(async () => {
        if (authState !== "PORTAL") return;
        setLoading(true);
        setStatusMsg("Synchronizing Workspace...");

        try {
          const res = await fetch(`${SCRIPT_URL}?week=${weekNo}`);
          const data = await res.json();

          if (data.status === 200) {
            setIsLocked(Boolean(data.weekMeta?.isLocked));
            
            // Safe parse attendees
            try {
              const pNtpc = typeof data.weekMeta?.ntpc === 'string' ? JSON.parse(data.weekMeta.ntpc) : data.weekMeta?.ntpc;
              const pTpl = typeof data.weekMeta?.tpl === 'string' ? JSON.parse(data.weekMeta.tpl) : data.weekMeta?.tpl;
              setAttendees({
                ntpc: Array.isArray(pNtpc) && pNtpc.length ? pNtpc : [{ name: "", desig: "" }],
                tpl: Array.isArray(pTpl) && pTpl.length ? pTpl : [{ name: "", desig: "" }]
              });
            } catch (e) {
              setAttendees({ ntpc: [{ name: "", desig: "" }], tpl: [{ name: "", desig: "" }] });
            }

            if (data.allWeeks?.length) setAvailableWeeks(data.allWeeks);

            // Set L2
            setL2Schedule((data.l2Data || []).filter(r => r.Work_Description).map(r => ({
              id: r.L2_ID || "",
              discipline: r.Discipline || "Civil",
              desc: r.Work_Description || "",
              l2Start: formatDate(r.L2_Start),
              actStart: formatDate(r.Act_Start),
              l2End: formatDate(r.L2_End),
              actEnd: formatDate(r.Act_End)
            })));

            // Set Executions
            const mapExec = (r) => ({
              id: r.Task_ID || "",
              l2Ref: r.L2_Reference || "",
              taskName: r.Task_Name || "",
              unit: r.Unit || "m³",
              plan: parseFloat(r.Wk_Plan) || 0,
              act: parseFloat(r.Wk_Act) || 0,
              next: parseFloat(r.Next_Plan) || 0,
              cumBacklog: parseFloat(r.Cum_Backlog) || 0,
              hindrance: r.Hindrance || "",
              tplRemarks: r.TPL_Remarks || "",
              ntpcDirectives: r.NTPC_Directives || "",
              milestone: r.Milestone_Status || "None"
            });

            setCivilTasks((data.civilData || []).filter(r => r.L2_Reference || r.Task_Name).map(mapExec));
            setMechTasks((data.mechData || []).filter(r => r.L2_Reference || r.Task_Name).map(mapExec));
            setElecTasks((data.elecData || []).filter(r => r.L2_Reference || r.Task_Name).map(mapExec));
            setCivilHistory(data.civilHistory || {});

            // Set Drawings
            setDrawings((data.drawingData || []).filter(r => r.Drawing_No).map(r => ({
              id: r.Dwg_ID || "",
              discipline: r.Discipline || "Civil",
              drawingNo: r.Drawing_No || "",
              desc: r.Description || "",
              priority: r.Priority || "Moderate",
              targetDate: formatDate(r.Target_Date),
              expectedDate: formatDate(r.Expected_Date),
              status: r.Status || "Pending",
              frontImpact: r.Front_Impact || "",
              remarks: r.Remarks || ""
            })));

            // Logs & Actions
            setSafetyLogs((data.safetyData || []).filter(s => s.Description).map(s => ({
              id: s.Log_ID, weekNo: s.Week_No || weekNo, category: s.Category || "Unsafe Condition", desc: s.Description, status: s.Status || "Open", photoUrl: s.Photo_URL || ""
            })));

            setQualityLogs((data.qualityData || []).filter(q => q.Description).map(q => ({
              id: q.Log_ID, weekNo: q.Week_No || weekNo, category: q.Category || "Civil NCR", desc: q.Description, status: q.Status || "Open", photoUrl: q.Photo_URL || ""
            })));

            setActions((data.actionData || []).filter(a => a.Description).map(a => ({
              id: a.Action_ID || "", weekNo: a.Week_No || weekNo, category: a.Category || "Execution", desc: a.Description, responsibility: a.Responsibility || "TPL", targetDate: formatDate(a.Target_Date), revisedDate: formatDate(a.Revised_Date), status: a.Status || "Pending", ntpcRemarks: a.NTPC_Remarks || ""
            })));

            setStatusMsg("Connected & Synced");
          }
        } catch (e) {
          setStatusMsg("Offline Mode");
        } finally {
          setLoading(false);
        }
      }, [weekNo, authState]);

      useEffect(() => { loadData(); }, [loadData]);

      // Authentication Handler
      const handleLogin = async () => {
        if (!loginForm.userId || !loginForm.password) return alert("Enter credentials");
        setLoading(true);
        setStatusMsg("Validating...");
        const res = await apiPost({ action: "LOGIN", userId: loginForm.userId, password: loginForm.password });
        if (res.status === 200) {
          setRole(res.role);
          localStorage.setItem("wrm_role", res.role);
          localStorage.setItem("wrm_userId", loginForm.userId);
          setAuthState("PORTAL");
        } else {
          alert(res.error || "Login failed");
        }
        setLoading(false);
      };

      const handleLogout = () => {
        localStorage.clear();
        setAuthState("LOGIN");
      };

      // Direct Image Extractor
      const fetchAndShowImage = async (urlOrId) => {
        if (!urlOrId) return;
        let fileId = urlOrId;
        const match = urlOrId.match(/(?:id=|d\/)([a-zA-Z0-9_-]{25,})/);
        if (match) fileId = match[1];

        setViewImageId(fileId);
        setImageLoading(true);
        setViewImageData(null);

        const res = await apiPost({ action: "GET_IMAGE", fileId });
        if (res.status === 200) {
          setViewImageData(res.base64);
        } else {
          alert("Image fetch failed: " + (res.error || "Permission Denied"));
          setViewImageId(null);
        }
        setImageLoading(false);
      };

      // Array Item State Updaters
      const currentTasks = activeDiscipline === "Civil_Execution" ? civilTasks : activeDiscipline === "Mech_Execution" ? mechTasks : elecTasks;
      const setCurrentTasks = (u) => {
        if (activeDiscipline === "Civil_Execution") setCivilTasks(u);
        else if (activeDiscipline === "Mech_Execution") setMechTasks(u);
        else setElecTasks(u);
      };

      const handleRowChange = (arr, setArr, idx, field, val) => {
        const copy = [...arr];
        copy[idx][field] = val;
        setArr(copy);
      };

      const handleTaskMetricChange = (idx, field, val) => {
        const copy = [...currentTasks];
        copy[idx][field] = val;
        
        // Dynamic Live Calculation
        const plan = parseFloat(field === 'plan' ? val : copy[idx].plan) || 0;
        const act = parseFloat(field === 'act' ? val : copy[idx].act) || 0;
        const currentVariance = act - plan;
        
        // Instant visual feedback for cumulative backlog
        if (field === 'act' || field === 'plan') {
          const prevBacklog = parseFloat(copy[idx].cumBacklog) || 0;
          if (currentVariance < 0) {
            copy[idx].computedBacklog = prevBacklog + Math.abs(currentVariance);
          } else {
            copy[idx].computedBacklog = Math.max(0, prevBacklog - currentVariance);
          }
        }
        setCurrentTasks(copy);
      };

      // Data Persistence
      const saveActiveSheet = async (sheetName, rows) => {
        setLoading(true);
        setStatusMsg(`Saving ${sheetName}...`);
        const res = await apiPost({ action: "SAVE_DATA", weekNo, role, sheetName, rows });
        if (res.status === 200) {
          setStatusMsg("Changes Recorded");
          loadData();
        } else {
          alert(res.error || "Save Failed");
        }
        setLoading(false);
      };

      const submitLog = async () => {
        if (!logForm.desc) return alert("Please provide a description.");
        setLoading(true);
        setStatusMsg("Uploading Observation...");
        
        let b64 = "", fName = "", mType = "";
        if (logForm.file) {
          fName = logForm.file.name;
          mType = logForm.file.type;
          b64 = await new Promise((res) => {
            const rd = new FileReader();
            rd.onload = () => res(rd.result.split(',')[1]);
            rd.readAsDataURL(logForm.file);
          });
        }

        const res = await apiPost({
          action: "SAVE_LOG",
          weekNo,
          logType: logForm.type,
          category: logForm.category,
          desc: logForm.desc,
          photoBase64: b64,
          fileName: fName,
          mimeType: mType
        });

        if (res.status === 200) {
          setShowLogModal(false);
          setLogForm({ type: "Safety", category: "Unsafe Condition", desc: "", file: null });
          loadData();
        } else {
          alert("Log failed: " + (res.error || "Unknown error"));
        }
        setLoading(false);
      };

      const toggleStatus = async (sheetName, logId, currentStatus) => {
        const newStatus = (currentStatus === "Open" || currentStatus === "Pending") ? "Complied" : "Open";
        setLoading(true);
        setStatusMsg("Updating Status...");
        await apiPost({ action: "UPDATE_LOG_STATUS", role, sheetName, logId, status: newStatus });
        loadData();
      };

      // Computed Metrics
      const calcProgress = (tasks) => {
        if (!tasks.length) return 0;
        const p = tasks.reduce((a, t) => a + (parseFloat(t.plan) || 0), 0);
        const a = tasks.reduce((a, t) => a + (parseFloat(t.act) || 0), 0);
        return p === 0 ? 0 : Math.min(100, Math.round((a / p) * 100));
      };

      const chartData = useMemo(() => {
        const key = activeChartTask.toLowerCase();
        if (!civilHistory[key]) return [];
        return Object.keys(civilHistory[key])
          .sort((a, b) => parseInt(a) - parseInt(b))
          .map(w => ({ week: w, value: civilHistory[key][w] }));
      }, [civilHistory, activeChartTask]);

      const isTplDisabled = role === "TPL" && isLocked;

      // ==========================================
      // VIEW: LOGIN SCREEN
      // ==========================================
      if (authState === "LOGIN") {
        return (
          <div class="min-h-screen flex items-center justify-center bg-slate-900 px-4">
            <div class="bg-white p-8 sm:p-10 rounded-3xl max-w-md w-full shadow-2xl border border-slate-100 fade-in">
              <div class="flex items-center gap-3 justify-center mb-8">
                <div class="w-12 h-12 bg-ntpc-blue text-white rounded-2xl flex items-center justify-center font-black text-2xl shadow-lg border-2 border-orange-500">N</div>
                <div class="text-left">
                  <h1 class="text-base font-black text-ntpc-blue uppercase tracking-tight">NTPC Nabinagar</h1>
                  <p class="text-[10px] font-extrabold text-orange-600 uppercase tracking-widest">Stage-II Review Portal</p>
                </div>
              </div>

              <div class="space-y-4">
                <div>
                  <label class="text-[10px] font-extrabold uppercase text-slate-400 block mb-1.5 ml-1">Username / ID</label>
                  <input type="text" value={loginForm.userId} onChange={e => setLoginForm({ ...loginForm, userId: e.target.value })}
                    class="w-full bg-slate-50 border border-slate-200 px-4 py-3 rounded-xl text-sm font-semibold outline-none focus:border-ntpc-blue focus:bg-white transition-all"
                    placeholder="e.g. NTPC_ADMIN" />
                </div>
                <div>
                  <label class="text-[10px] font-extrabold uppercase text-slate-400 block mb-1.5 ml-1">Password</label>
                  <input type="password" value={loginForm.password} onChange={e => setLoginForm({ ...loginForm, password: e.target.value })}
                    class="w-full bg-slate-50 border border-slate-200 px-4 py-3 rounded-xl text-sm font-semibold outline-none focus:border-ntpc-blue focus:bg-white transition-all"
                    placeholder="••••••••" />
                </div>

                <button onClick={handleLogin} disabled={loading}
                  class="w-full mt-2 bg-ntpc-blue hover:bg-slate-900 text-white font-extrabold py-3.5 rounded-xl text-xs uppercase tracking-widest shadow-lg shadow-blue-900/20 active:scale-[0.99] transition-all flex items-center justify-center gap-2">
                  {loading ? <div class="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></div> : "Secure Access"}
                </button>
              </div>

              <div class="mt-8 pt-6 border-t border-slate-100 text-center">
                <p class="text-[11px] font-bold text-slate-400 uppercase tracking-widest">Employer: NTPC | EPC: M/s TPL</p>
              </div>
            </div>
          </div>
        );
      }

      // ==========================================
      // VIEW: MAIN ENTERPRISE DASHBOARD
      // ==========================================
      return (
        <div class="min-h-screen flex flex-col">
          <datalist id="preset-tasks">{presetCivilTasks.map(pt => <option key={pt} value={pt} />)}</datalist>

          {/* GLOBAL REALTIME LOADER OVERLAY */}
          {loading && (
            <div class="fixed bottom-6 right-6 z-50 bg-slate-900/90 backdrop-blur-md text-white px-5 py-3 rounded-2xl shadow-2xl border border-white/10 flex items-center gap-3 fade-in">
              <div class="w-4 h-4 border-2 border-orange-500 border-t-transparent rounded-full animate-spin"></div>
              <span class="text-xs font-bold tracking-wide">{statusMsg || "Processing..."}</span>
            </div>
          )}

          {/* TOP APP BAR */}
          <header class="bg-ntpc-navy text-white px-6 py-3 sticky top-0 z-40 shadow-md no-print border-b border-white/10">
            <div class="max-w-[1600px] mx-auto flex flex-wrap items-center justify-between gap-4">
              <div class="flex items-center gap-3">
                <div class="w-9 h-9 bg-ntpc-orange text-white rounded-xl flex items-center justify-center font-black text-lg shadow-md border border-white/20">N</div>
                <div>
                  <h1 class="text-xs font-black uppercase tracking-wider leading-none">Nabinagar STPP Stage-II</h1>
                  <p class="text-[9px] text-orange-400 font-bold uppercase tracking-widest mt-1">Weekly Review Management (WRM)</p>
                </div>
              </div>

              {/* Central Dynamic Tab Selector */}
              <nav class="flex items-center bg-black/30 p-1 rounded-xl border border-white/10">
                {[
                  { id: "DASHBOARD", label: "Executive Summary" },
                  { id: "L2 SCHEDULE", label: "L2 Master Fronts" },
                  { id: "EXECUTION", label: "Discipline Execution" },
                  { id: "DRAWINGS", label: "Engineering & DCI" },
                  { id: "HSE & QA", label: "HSE & Quality NCR" },
                  { id: "ACTIONS", label: "Bottlenecks Tracker" }
                ].map(t => (
                  <button key={t.id} onClick={() => setTab(t.id)}
                    class={`px-3.5 py-1.5 text-[10px] font-black uppercase tracking-wider rounded-lg transition-all ${tab === t.id ? "bg-ntpc-orange text-white shadow-md" : "text-slate-300 hover:text-white"}`}>
                    {t.label}
                  </button>
                ))}
              </nav>

              {/* Action Controls */}
              <div class="flex items-center gap-2.5">
                <select value={weekNo} onChange={e => setWeekNo(parseInt(e.target.value))}
                  class="bg-black/40 text-white text-xs font-bold px-3 py-1.5 rounded-lg border border-white/10 outline-none cursor-pointer">
                  {availableWeeks.map(w => <option key={w} value={w} class="text-slate-900">Review Week {w}</option>)}
                </select>

                {role === "NTPC" && (
                  <button onClick={() => setShowWeekModal(true)} title="Initialize Next Review Week"
                    class="bg-blue-600 hover:bg-blue-500 text-white px-2.5 py-1.5 rounded-lg text-xs font-black uppercase shadow">
                    + Wk
                  </button>
                )}

                <span class={`px-2.5 py-1 text-[9px] font-black tracking-widest uppercase rounded-md border ${isLocked ? "bg-red-500/20 text-red-300 border-red-500/30" : "bg-emerald-500/20 text-emerald-300 border-emerald-500/30"}`}>
                  {isLocked ? "LOCKED" : "OPEN"}
                </span>

                <button onClick={() => window.print()}
                  class="bg-white hover:bg-slate-100 text-ntpc-navy px-3.5 py-1.5 rounded-lg text-xs font-extrabold uppercase tracking-wider shadow">
                  Print MoM
                </button>

                <button onClick={handleLogout}
                  class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-lg text-xs font-bold uppercase">
                  Exit
                </button>
              </div>
            </div>
          </header>

          {/* MAIN APPLICATION CONTAINER */}
          <main class="max-w-[1600px] w-full mx-auto p-5 sm:p-6 flex-1 no-print">

            {/* ========================================================= */}
            {/* TAB: EXECUTIVE DASHBOARD */}
            {/* ========================================================= */}
            {tab === "DASHBOARD" && (
              <div class="space-y-6 fade-in">
                {/* Top Discipline Execution Progress Ring Gauges */}
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">

                          <td class="p-2">
                            <select disabled={isTplDisabled} value={d.priority || "Moderate"} onChange={e => handleRowChange(drawings, setDrawings, idx, "priority", e.target.value)}
                              class={`w-full rounded p-1 font-black text-[9px] text-center outline-none ${d.priority === 'High' ? 'bg-rose-100 text-rose-700' : d.priority === 'Low' ? 'bg-slate-100 text-slate-500' : 'bg-amber-100 text-amber-700'}`}>
                              <option>High</option><option>Moderate</option><option>Low</option>
                            </select>
                          </td>
                          <td class="p-2 text-center"><input type="date" disabled={isTplDisabled} value={d.targetDate || ""} onChange={e => handleRowChange(drawings, setDrawings, idx, "targetDate", e.target.value)} class="bg-slate-100 p-1 rounded text-[9.5px] font-bold outline-none" /></td>
                          <td class="p-2 text-center"><input type="date" disabled={isTplDisabled} value={d.expectedDate || ""} onChange={e => handleRowChange(drawings, setDrawings, idx, "expectedDate", e.target.value)} class="bg-slate-100 p-1 rounded text-[9.5px] font-bold text-orange-600 outline-none" /></td>
                          <td class="p-2 text-center">
                            <button onClick={() => {
                              if (role !== "NTPC") return;
                              const next = d.status === "Pending" ? "Under Review" : d.status === "Under Review" ? "Cat-1 Approved" : "Pending";
                              handleRowChange(drawings, setDrawings, idx, "status", next);
                            }} class={`px-2 py-1 rounded text-[9px] font-black uppercase w-full ${d.status === "Cat-1 Approved" ? "bg-emerald-100 text-emerald-800" : d.status === "Under Review" ? "bg-amber-100 text-amber-800" : "bg-rose-100 text-rose-800"}`}>
                              {d.status || "Pending"}
                            </button>
                          </td>
                          <td class="p-2"><textarea rows="1" disabled={isTplDisabled} value={d.frontImpact || ""} onChange={e => handleRowChange(drawings, setDrawings, idx, "frontImpact", e.target.value)} class="w-full bg-slate-50 border border-slate-200 rounded p-1 text-[9.5px] outline-none text-rose-950 font-bold" /></td>
                          <td class="p-2"><textarea rows="1" disabled={isTplDisabled} value={d.remarks || ""} onChange={e => handleRowChange(drawings, setDrawings, idx, "remarks", e.target.value)} class="w-full bg-slate-50 border border-slate-200 rounded p-1 text-[9.5px] outline-none" /></td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            {/* ========================================================= */}
            {/* TAB: HSE OBSERVATIONS & QUALITY NCR */}
            {/* ========================================================= */}
            {tab === "HSE & QA" && (
              <div class="space-y-6 fade-in">
                <div class="flex items-center justify-between">
                  <div>
                    <h2 class="text-xs font-black text-ntpc-blue uppercase tracking-wider">Site Safety & Quality Surveillance</h2>
                    <p class="text-[10px] text-slate-400 font-bold uppercase mt-0.5">Non-Conformance Reports & Near-Miss Analytics</p>
                  </div>
                  <button onClick={() => setShowLogModal(true)} disabled={isTplDisabled}
                    class="bg-ntpc-orange hover:bg-orange-600 text-white px-4 py-2 rounded-xl text-xs font-black uppercase tracking-wider shadow">
                    + Log Site Observation (With Photo)
                  </button>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                  {/* Safety */}
                  <div class="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm">
                    <h3 class="text-xs font-black text-orange-600 uppercase tracking-wider mb-3">HSE Safety Violations Log</h3>
                    <div class="space-y-3 max-h-[500px] overflow-y-auto pr-1 custom-scroll">
                      {safetyLogs.length === 0 ? <p class="text-xs text-slate-400">No safety logs recorded.</p> : safetyLogs.map((s, i) => (
                        <div key={i} class="p-3.5 bg-slate-50 rounded-xl border border-slate-200">
                          <div class="flex items-center justify-between">
                            <span class="text-xs font-black text-ntpc-blue">{s.id} (Wk {s.weekNo}) • {s.category}</span>
                            <button onClick={() => toggleStatus("Safety_Logs", s.id, s.status)} disabled={role !== "NTPC"}
                              class={`px-2.5 py-0.5 rounded text-[9px] font-black uppercase ${s.status === 'Complied' ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800'}`}>
                              {s.status === 'Complied' ? '✓ Complied' : '⚠ Open'}
                            </button>
                          </div>
                          <p class="text-slate-700 text-xs mt-2 font-medium">{s.desc}</p>
                          {s.photoUrl && (
                            <button onClick={() => fetchAndShowImage(s.photoUrl)} class="text-blue-600 hover:text-blue-800 font-bold text-[10px] mt-2 flex items-center gap-1 uppercase tracking-wider">
                              📷 View Photographic Evidence
                            </button>
                          )}
                        </div>
                      ))}
                    </div>
                  </div>

                  {/* Quality */}
                  <div class="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm">
                    <h3 class="text-xs font-black text-blue-600 uppercase tracking-wider mb-3">Quality Assurance & FQA NCRs</h3>
                    <div class="space-y-3 max-h-[500px] overflow-y-auto pr-1 custom-scroll">
                      {qualityLogs.length === 0 ? <p class="text-xs text-slate-400">No quality NCRs recorded.</p> : qualityLogs.map((q, i) => (
                        <div key={i} class="p-3.5 bg-slate-50 rounded-xl border border-slate-200">
                          <div class="flex items-center justify-between">
                            <span class="text-xs font-black text-ntpc-blue">{q.id} (Wk {q.weekNo}) • {q.category}</span>
                            <button onClick={() => toggleStatus("Quality_Logs", q.id, q.status)} disabled={role !== "NTPC"}
                              class={`px-2.5 py-0.5 rounded text-[9px] font-black uppercase ${q.status === 'Complied' ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800'}`}>
                              {q.status === 'Complied' ? '✓ Complied' : '⚠ Open'}
                            </button>
                          </div>
                          <p class="text-slate-700 text-xs mt-2 font-medium">{q.desc}</p>
                          {q.photoUrl && (
                            <button onClick={() => fetchAndShowImage(q.photoUrl)} class="text-blue-600 hover:text-blue-800 font-bold text-[10px] mt-2 flex items-center gap-1 uppercase tracking-wider">
                              📷 View Inspection Report Photo
                            </button>
                          )}
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* ========================================================= */}
            {/* TAB: BOTTLENECKS & ACTION TRACKER */}
            {/* ========================================================= */}
            {tab === "ACTIONS" && (
              <div class="bg-white rounded-2xl border border-slate-200/80 shadow-sm overflow-hidden fade-in">
                <div class="p-4 bg-slate-50/80 border-b border-slate-200 flex items-center justify-between">
                  <div>
                    <h2 class="text-xs font-black text-ntpc-blue uppercase tracking-wider">Bottlenecks, Hindrances & Master Action Tracker</h2>
                    <p class="text-[10px] text-slate-400 font-bold uppercase mt-0.5">Critical Inter-Department Clearances</p>
                  </div>
                  <div class="flex items-center gap-2">
                    <button onClick={() => setActions([...actions, { id: "", category: "Execution", desc: "", responsibility: "TPL", targetDate: "", revisedDate: "", status: "Pending", ntpcRemarks: "" }])}
                      disabled={isTplDisabled} class="bg-ntpc-orange hover:bg-orange-600 text-white px-3.5 py-1.5 rounded-lg text-xs font-extrabold uppercase tracking-wide disabled:opacity-40">
                      + Add Action Point
                    </button>
                    <button onClick={() => saveActiveSheet("Action_Tracker", actions)}
                      class="bg-ntpc-blue hover:bg-slate-900 text-white px-4 py-1.5 rounded-lg text-xs font-extrabold uppercase tracking-wide">
                      Save Action Tracker
                    </button>
                  </div>
                </div>

                <div class="table-container max-h-[calc(100vh-250px)] overflow-y-auto custom-scroll">
                  <table class="w-full text-left text-xs">
                    <thead>
                      <tr class="bg-ntpc-navy text-white text-[9px] uppercase tracking-wider sticky-th">
                        <th class="p-3 w-[10%]">Category</th>
                        <th class="p-3 w-[26%]">Description of Obstruction / Action Item</th>
                        <th class="p-3 w-[10%]">Responsibility</th>
                        <th class="p-3 w-[10%] text-center">Target Date</th>
                        <th class="p-3 w-[10%] text-center">Revised Target</th>
                        <th class="p-3 w-[10%] text-center">Status</th>
                        <th class="p-3 w-[24%]">NTPC Review & Directives</th>
                      </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-100">
                      {actions.map((a, idx) => (
                        <tr key={idx} class="hover:bg-slate-50/60">
                          <td class="p-2">
                            <select disabled={isTplDisabled} value={a.category || "Execution"} onChange={e => handleRowChange(actions, setActions, idx, "category", e.target.value)}
                              class="w-full bg-slate-100 rounded p-1 font-bold text-[10px] outline-none">
                              <option>Execution</option><option>Engineering</option><option>Procurement</option><option>Clearance</option>
                            </select>
                          </td>
                          <td class="p-2">
                            <span class="text-[8px] font-black text-rose-500 uppercase block">{a.weekNo && a.weekNo != weekNo ? `Carried from Wk ${a.weekNo}` : ''}</span>
                            <input type="text" disabled={isTplDisabled} value={a.desc || ""} onChange={e => handleRowChange(actions, setActions, idx, "desc", e.target.value)}
                              class="w-full bg-transparent font-bold border-b border-slate-200 outline-none text-[11px]" placeholder="Specific roadblock detail..." />
                          </td>
                          <td class="p-2"><input type="text" disabled={isTplDisabled} value={a.responsibility || ""} onChange={e => handleRowChange(actions, setActions, idx, "responsibility", e.target.value)} class="w-full bg-slate-100 font-bold p-1 rounded text-[10px] outline-none" /></td>
                          <td class="p-2 text-center"><input type="date" disabled={isTplDisabled} value={a.targetDate || ""} onChange={e => handleRowChange(actions, setActions, idx, "targetDate", e.target.value)} class="bg-slate-100 p-1 rounded text-[9.5px] font-bold outline-none" /></td>
                          <td class="p-2 text-center"><input type="date" disabled={role === "TPL"} value={a.revisedDate || ""} onChange={e => handleRowChange(actions, setActions, idx, "revisedDate", e.target.value)} class="bg-amber-50 text-amber-800 p-1 rounded text-[9.5px] font-bold outline-none" title="NTPC Authorized Revision" /></td>
                          <td class="p-2 text-center">
                            <button onClick={() => {
                              if (role !== "NTPC") return;
                              const ns = a.status === "Pending" ? "In Progress" : a.status === "In Progress" ? "Completed" : "Pending";
                              handleRowChange(actions, setActions, idx, "status", ns);
                            }} class={`px-2 py-1 rounded text-[9px] font-black uppercase w-full ${a.status === "Completed" ? "bg-emerald-100 text-emerald-800" : a.status === "In Progress" ? "bg-amber-100 text-amber-800" : "bg-rose-100 text-rose-800"}`}>
                              {a.status || "Pending"}
                            </button>
                          </td>
                          <td class="p-2"><textarea rows="1" disabled={role === "TPL"} value={a.ntpcRemarks || ""} onChange={e => handleRowChange(actions, setActions, idx, "ntpcRemarks", e.target.value)} class="w-full bg-rose-50/20 border border-slate-200 rounded p-1 text-[9.5px] outline-none text-rose-950 font-bold" /></td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            )}
          </main>

          {/* ========================================================= */}
          {/* MODALS & DIALOGS */}
          {/* ========================================================= */}

          {/* SECURE IMAGE LIGHTBOX */}
          {viewImageId && (
            <div class="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 flex items-center justify-center p-4 fade-in">
              <div class="bg-white rounded-3xl p-6 max-w-2xl w-full shadow-2xl relative flex flex-col items-center">
                <button onClick={() => setViewImageId(null)} class="absolute top-5 right-5 text-slate-400 hover:text-slate-800 font-black text-xl">✕</button>
                <span class="text-[10px] font-black uppercase tracking-widest text-ntpc-blue mb-4">Inspection Site Observation</span>
                
                <div class="w-full min-h-[300px] max-h-[65vh] flex items-center justify-center bg-slate-100 rounded-2xl overflow-hidden border border-slate-200">
                  {imageLoading ? (
                    <div class="flex flex-col items-center gap-2">
                      <div class="w-8 h-8 border-3 border-orange-500 border-t-transparent rounded-full animate-spin"></div>
                      <span class="text-xs font-bold text-slate-500">Decrypting from secure Google Drive...</span>
                    </div>
                  ) : viewImageData ? (
                    <img src={viewImageData} class="max-w-full max-h-[60vh] object-contain rounded-xl" alt="Observation" />
                  ) : (
                    <p class="text-xs font-bold text-rose-600">Failed to render image content.</p>
                  )}
                </div>

                <div class="mt-4 flex justify-end w-full">
                  <a href={`https://drive.google.com/file/d/${viewImageId}/view`} target="_blank" class="text-xs font-extrabold text-blue-600 hover:underline uppercase tracking-wider">
                    Open Drive Tab →
                  </a>
                </div>
              </div>
            </div>
          )}

          {/* LOG OBSERVATION MODAL */}
          {showLogModal && (
            <div class="fixed inset-0 bg-slate-950/70 backdrop-blur-sm z-50 flex items-center justify-center p-4 fade-in">
              <div class="bg-white rounded-3xl p-6 sm:p-8 max-w-md w-full shadow-2xl border border-slate-100">
                <h3 class="text-xs font-black text-ntpc-blue uppercase tracking-widest mb-4 border-b border-slate-100 pb-3">Register Site Observation</h3>
                <div class="space-y-3.5">
                  <div>
                    <label class="text-[9px] font-black uppercase text-slate-400 block mb-1">Surveillance Type</label>
                    <select value={logForm.type} onChange={e => setLogForm({ ...logForm, type: e.target.value, category: e.target.value === "Safety" ? "Unsafe Condition" : "Civil NCR" })}
                      class="w-full bg-slate-50 border border-slate-200 p-2.5 rounded-xl text-xs font-bold outline-none">
                      <option value="Safety">HSE Safety Violation</option>
                      <option value="Quality">FQA Quality NCR</option>
                    </select>
                  </div>
                  <div>
                    <label class="text-[9px] font-black uppercase text-slate-400 block mb-1">Classification</label>
                    {logForm.type === 'Safety' ? (
                      <select value={logForm.category} onChange={e => setLogForm({ ...logForm, category: e.target.value })}
                        class="w-full bg-slate-50 border border-slate-200 p-2.5 rounded-xl text-xs font-bold outline-none">
                        <option value="Unsafe Condition">Unsafe Condition</option>
                        <option value="Unsafe Act">Unsafe Act</option>
                        <option value="Near Miss">Near Miss</option>
                      </select>
                    ) : (
                      <input type="text" value={logForm.category} onChange={e => setLogForm({ ...logForm, category: e.target.value })}
                        class="w-full bg-slate-50 border border-slate-200 p-2.5 rounded-xl text-xs font-bold outline-none" placeholder="e.g. Honeycombing in Raft" />
                    )}
                  </div>
                  <div>
                    <label class="text-[9px] font-black uppercase text-slate-400 block mb-1">Observation Description</label>
                    <textarea rows="3" value={logForm.desc} onChange={e => setLogForm({ ...logForm, desc: e.target.value })}
                      class="w-full bg-slate-50 border border-slate-200 p-2.5 rounded-xl text-xs font-bold outline-none" placeholder="Exact site location & violation..."></textarea>
                  </div>
                  <div class="bg-slate-50 border-2 border-dashed border-slate-300 p-3.5 rounded-xl text-center">
                    <label class="text-[9px] font-black uppercase text-slate-400 block mb-2">Upload Photo Evidence</label>
                    <input type="file" accept="image/*" onChange={e => setLogForm({ ...logForm, file: e.target.files[0] })}
                      class="w-full text-[11px] font-bold file:mr-3 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:bg-ntpc-blue file:text-white file:text-[9px] file:font-black file:uppercase file:cursor-pointer" />
                  </div>
                </div>

                <div class="flex gap-3 mt-6">
                  <button onClick={() => setShowLogModal(false)} class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 py-2.5 rounded-xl text-xs font-black uppercase tracking-wider">Cancel</button>
                  <button onClick={submitLog} class="flex-1 bg-ntpc-orange hover:bg-orange-600 text-white py-2.5 rounded-xl text-xs font-black uppercase tracking-wider shadow">Submit Log</button>
                </div>
              </div>
            </div>
          )}

          {/* INITIALIZE WEEK MODAL */}
          {showWeekModal && (
            <div class="fixed inset-0 bg-slate-950/70 backdrop-blur-sm z-50 flex items-center justify-center p-4 fade-in">
              <div class="bg-white rounded-3xl p-6 sm:p-8 max-w-sm w-full shadow-2xl border border-slate-100">
                <h3 class="text-xs font-black text-ntpc-blue uppercase tracking-widest mb-3">Initialize Next Review Cycle</h3>
                <p class="text-[11px] text-slate-500 mb-4 font-medium">Auto-carries forward all open milestones, adjusts cumulative backlogs, and copies active drawing rosters.</p>
                <div>
                  <label class="text-[9px] font-black uppercase text-slate-400 block mb-1">New Review Sequence Number</label>
                  <input type="number" value={newWeekInput} onChange={e => setNewWeekInput(e.target.value)}
                    class="w-full bg-slate-50 border border-slate-200 p-3 rounded-xl text-sm font-black outline-none" />
                </div>
                <div class="flex gap-3 mt-6">
                  <button onClick={() => setShowWeekModal(false)} class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 py-2.5 rounded-xl text-xs font-black uppercase tracking-wider">Cancel</button>
                  <button onClick={async () => {
                    setLoading(true);
                    await apiPost({ action: "CREATE_WEEK", newWeekNo: parseInt(newWeekInput) });
                    setShowWeekModal(false);
                    loadData();
                  }} class="flex-1 bg-ntpc-blue hover:bg-slate-900 text-white py-2.5 rounded-xl text-xs font-black uppercase tracking-wider shadow">Create & Sync</button>
                </div>
              </div>
            </div>
          )}

          {/* ========================================================= */}
          {/* PRINTABLE MINUTES OF MEETING (MoM) — A4 LANDSCAPE */}
          {/* ========================================================= */}
          <div id="printable-mom" class="hidden print:block font-serif text-black bg-white">
            <div class="border-b-2 border-black pb-2 mb-4 flex justify-between items-end">
              <div>
                <h1 class="text-base font-bold uppercase tracking-tight">Nabinagar Super Thermal Power Project Stage-II (3 x 660 MW)</h1>
                <h2 class="text-xs font-semibold uppercase text-slate-700 mt-0.5">Minutes of Weekly Review Meeting (WRM) — Week #{weekNo}</h2>
              </div>
              <div class="text-right text-[8px] font-bold">
                REF: NTPC/NSTPP-II/WRM/{weekNo}<br />
                Date: {new Date().toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' })}
              </div>
            </div>

            <h3 class="text-[9px] font-bold uppercase mb-1">1. Meeting Participants</h3>
            <table class="mb-4">
              <thead>
                <tr><th class="w-1/2">Employer Representatives (NTPC)</th><th class="w-1/2">EPC Contractor Representatives (M/s TPL)</th></tr>
              </thead>
              <tbody>
                <tr>
                  <td class="align-top">
                    <ul class="list-disc pl-4 space-y-0.5">
                      {attendees.ntpc.filter(a => a.name).map((a, i) => <li key={i}><strong>{a.name}</strong> — {a.desig}</li>)}
                    </ul>
                  </td>
                  <td class="align-top">
                    <ul class="list-disc pl-4 space-y-0.5">
                      {attendees.tpl.filter(a => a.name).map((a, i) => <li key={i}><strong>{a.name}</strong> — {a.desig}</li>)}
                    </ul>
                  </td>
                </tr>
              </tbody>
            </table>

            <h3 class="text-[9px] font-bold uppercase mb-1">2. Discipline Execution Performance</h3>
            <table class="mb-4">
              <thead>
                <tr>
                  <th>L2 Work Front & Task Description</th>
                  <th class="text-center w-12">Plan</th>
                  <th class="text-center w-12">Actual</th>
                  <th class="text-center w-12">Var.</th>
                  <th class="text-center w-12">Cum. BL</th>
                  <th>Identified Site Hindrance</th>
                  <th class="w-1/4">M/s TPL Remarks</th>
                  <th class="w-1/4">NTPC Directives</th>
                </tr>
              </thead>
              <tbody>
                {[...civilTasks, ...mechTasks, ...elecTasks].map((c, i) => (
                  <tr key={i}>
                    <td><strong>{c.l2Ref}</strong> — {c.taskName} ({c.unit})</td>
                    <td class="text-center">{c.plan}</td>
                    <td class="text-center">{c.act}</td>
                    <td class="text-center font-bold">{(parseFloat(c.act) || 0) - (parseFloat(c.plan) || 0)}</td>
                    <td class="text-center font-bold">{c.cumBacklog}</td>
                    <td>{c.hindrance}</td>
                    <td>{c.tplRemarks}</td>
                    <td class="font-bold">{c.ntpcDirectives}</td>
                  </tr>
                ))}
              </tbody>
            </table>

            <h3 class="text-[9px] font-bold uppercase mb-1">3. Pending Critical Actions & Bottlenecks</h3>
            <table class="mb-6">
              <thead>
                <tr>
                  <th>Action Point Description</th>
                  <th class="w-16">Resp.</th>
                  <th class="text-center w-20">Target Date</th>
                  <th class="text-center w-16">Status</th>
                  <th class="w-1/3">NTPC Review Comments</th>
                </tr>
              </thead>
              <tbody>
                {actions.map((a, i) => (
                  <tr key={i}>
                    <td><strong>{a.desc}</strong></td>
                    <td>{a.responsibility}</td>
                    <td class="text-center">{a.revisedDate || a.targetDate}</td>
                    <td class="text-center uppercase">{a.status}</td>
                    <td>{a.ntpcRemarks}</td>
                  </tr>
                ))}
              </tbody>
            </table>

            <div class="mt-12 flex justify-between text-[9px] font-bold uppercase px-8">
              <div class="text-center">
                _______________________________________<br /><br />
                Authorized Representative<br />
                <strong>(NTPC Limited)</strong>
              </div>
              <div class="text-center">
                _______________________________________<br /><br />
                Project In-Charge<br />
                <strong>(M/s TPL)</strong>
              </div>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
