<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NTPC Nabinagar STPP Stage-II — WRM</title>
  
  <!-- Tailwind CSS & React Engine -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
  
  <script>
    tailwind.config = { theme: { extend: { colors: { ntpc: { blue: '#0066b3', navy: '#06163a', orange: '#ea580c' } }, fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] } } } };
  </script>

  <style>
    body { background-color: #f8fafc; overflow: hidden; }
    .fade-in { animation: fadeIn 0.15s ease-out forwards; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    .custom-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scroll::-webkit-scrollbar-track { background: transparent; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    .sticky-th { position: sticky; top: 0; z-index: 20; }
    .sticky-th-sub { position: sticky; top: 28px; z-index: 19; }

    @media print {
      body { background: white !important; font-family: 'Times New Roman', serif; margin: 0; padding: 0; overflow: visible; }
      .no-print { display: none !important; }
      #printable-mom { display: block !important; width: 100% !important; color: black !important; }
      @page { size: A4 landscape; margin: 10mm; }
      table { border-collapse: collapse; width: 100%; page-break-inside: auto; }
      tr { page-break-inside: avoid; page-break-after: auto; }
      th { background-color: #f1f5f9 !important; color: #000 !important; font-weight: bold; border: 1px solid #94a3b8; padding: 4px 6px; font-size: 8.5px; }
      td { border: 1px solid #94a3b8; padding: 4px 6px; font-size: 8px; }
      .ntpc-header-text { font-family: 'Arial', sans-serif; font-weight: 900; font-size: 24px; color: #0066b3; margin-bottom: -4px; letter-spacing: -0.5px; }
      .ntpc-header-sub { font-family: 'Arial', sans-serif; font-style: italic; font-weight: bold; font-size: 11px; color: #000; }
      .header-gradient-line { height: 2px; background: linear-gradient(to right, rgba(0,0,0,0) 0%, rgba(133,184,107,1) 50%, rgba(0,0,0,0) 100%); margin-top: 4px; margin-bottom: 4px; }
    }
  </style>
</head>
<body class="text-slate-800 antialiased selection:bg-orange-500 selection:text-white">
  <div id="root"></div>

  <!-- 1. Network API -->
  <script src="./api.js"></script>

  <!-- 2. UI Components -->
  <script type="text/babel" src="./components/Sidebar.jsx"></script>
  <script type="text/babel" src="./components/Dashboard.jsx"></script>
  <script type="text/babel" src="./components/L2Schedule.jsx"></script>
  <script type="text/babel" src="./components/Execution.jsx"></script>
  <script type="text/babel" src="./components/Drawings.jsx"></script>
  <script type="text/babel" src="./components/HseQa.jsx"></script>
  <script type="text/babel" src="./components/Actions.jsx"></script>

  <!-- 3. Master Application -->
  <script type="text/babel" src="./App.jsx"></script>
</body>
</html>
